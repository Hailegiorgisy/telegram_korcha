<!doctype html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Korcha (ኮርቻ) - የውጭ ገበያ እቃ አቅራቢ</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        if (window.Telegram && window.Telegram.WebApp) {
          try {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            if (window.Telegram.WebApp.enableClosingConfirmation) {
              window.Telegram.WebApp.enableClosingConfirmation();
            }
            if (window.Telegram.WebApp.disableVerticalSwipes) {
              window.Telegram.WebApp.disableVerticalSwipes();
            }
          } catch (e) {}
        }
      })();
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 & ReactDOM (Pure Native Production Build - ZERO Babel, ZERO eval, ZERO build step) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        min-height: var(--tg-viewport-stable-height, 100vh);
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-y: none;
        -webkit-overflow-scrolling: touch;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f4;
        color: #1c1917;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      #root {
        min-height: 100%;
        min-height: var(--tg-viewport-stable-height, 100vh);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f4;">
        <div style="text-align:center;">
          <div style="width:40px;height:40px;border:4px solid #f59e0b;border-top-color:transparent;border-radius:50%;margin:0 auto;animation:spin 1s linear infinite;"></div>
          <p style="font-size:12px;font-weight:bold;color:#44403c;margin-top:10px;">ኮርቻ ሱቅ እየተከፈተ ነው...</p>
        </div>
      </div>
    </div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

    <!-- Pure Native JavaScript Application (100% CSP Safe - Runs in all Telegram WebApps) -->
    <script>
      (function() {
        const { useState, useEffect, createElement: h } = React;

        const INITIAL_PRODUCTS = [
          {
            id: 1,
            name: "Original Stanley Quencher H2.0 FlowState 40oz Tumbler",
            size: "40oz (1.18L)",
            price_etb: 4850,
            photo_url: "https://images.unsplash.com/photo-1577705998148-6da4f3963bc8?w=500&auto=format&fit=crop&q=80",
            photos: [
              "https://images.unsplash.com/photo-1577705998148-6da4f3963bc8?w=500&auto=format&fit=crop&q=80",
              "https://images.unsplash.com/photo-1544816155-12df9643f363?w=500&auto=format&fit=crop&q=80"
            ],
            description: "ቀኑን ሙሉ ቀዝቃዛ ወይም ትኩስ የሚያቆይ፣ ለስፖርትና ለቢሮ ተወዳጅ እቃ። 100% ኦሪጅናል ከ USA።",
            is_bestseller: true
          },
          {
            id: 2,
            name: "Apple AirPods Pro (2nd Generation) with MagSafe Case",
            size: "USB-C",
            price_etb: 14900,
            photo_url: "https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=500&auto=format&fit=crop&q=80",
            photos: [
              "https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=500&auto=format&fit=crop&q=80"
            ],
            description: "ምርጥ ድምፅ እና የጩኸት መከላከያ (Active Noise Cancellation) ያለው።",
            is_bestseller: true
          },
          {
            id: 3,
            name: "Hydrating Face Serum & Vitamin C Glow Complex",
            size: "50ml",
            price_etb: 1950,
            photo_url: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=500&auto=format&fit=crop&q=80",
            photos: [
              "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=500&auto=format&fit=crop&q=80"
            ],
            description: "የፊት ቆዳን የሚያለሰልስ እና ብሩህ የሚያደርግ የኮሪያ K-Beauty ሰረም።",
            is_bestseller: true
          }
        ];

        function KorchaApp() {
          const [activeTab, setActiveTab] = useState('home');
          const [products, setProducts] = useState(INITIAL_PRODUCTS);
          const [cart, setCart] = useState(function() {
            try {
              const raw = localStorage.getItem('korcha_cart');
              return raw ? JSON.parse(raw) : [];
            } catch (e) { return []; }
          });
          const [isCartOpen, setIsCartOpen] = useState(false);
          const [isQuoteOpen, setIsQuoteOpen] = useState(false);
          const [quoteMode, setQuoteMode] = useState('link');
          const [selectedRegion, setSelectedRegion] = useState('USA');
          const [zoomedProduct, setZoomedProduct] = useState(null);
          const [activePhotoIdx, setActivePhotoIdx] = useState(0);

          const [searchCode, setSearchCode] = useState('');
          const [trackedResult, setTrackedResult] = useState(null);
          const [isTracking, setIsTracking] = useState(false);

          const [orderPhone, setOrderPhone] = useState('');
          const [orderSpecs, setOrderSpecs] = useState('');

          useEffect(function() {
            if (window.Telegram && window.Telegram.WebApp) {
              try {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
              } catch (e) {}
            }
            fetch('/api/shelf')
              .then(function(res) { return res.json(); })
              .then(function(data) {
                if (data.products && data.products.length > 0) {
                  setProducts(data.products);
                }
              })
              .catch(function() {});
          }, []);

          useEffect(function() {
            try { localStorage.setItem('korcha_cart', JSON.stringify(cart)); } catch (e) {}
          }, [cart]);

          const addToCart = function(product) {
            setCart(function(prev) {
              const exist = prev.find(function(i) { return i.product.id === product.id; });
              if (exist) {
                return prev.map(function(i) {
                  return i.product.id === product.id ? Object.assign({}, i, { quantity: i.quantity + 1 }) : i;
                });
              }
              return prev.concat([{ product: product, quantity: 1 }]);
            });
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
              window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }
          };

          const updateCartQty = function(id, delta) {
            setCart(function(prev) {
              return prev.map(function(i) {
                if (i.product.id === id) {
                  const q = i.quantity + delta;
                  return q > 0 ? Object.assign({}, i, { quantity: q }) : null;
                }
                return i;
              }).filter(Boolean);
            });
          };

          const totalCartPrice = cart.reduce(function(s, i) { return s + (i.product.price_etb * i.quantity); }, 0);
          const totalCartCount = cart.reduce(function(s, i) { return s + i.quantity; }, 0);

          const handleTrack = function(e) {
            e.preventDefault();
            if (!searchCode.trim()) return;
            setIsTracking(true);
            fetch('/api/messages/customer?codes=' + encodeURIComponent(searchCode.trim()))
              .then(function(res) { return res.json(); })
              .then(function(data) {
                if (data.conversations && data.conversations.length > 0) {
                  setTrackedResult(data.conversations[0]);
                } else {
                  setTrackedResult({ notFound: true, code: searchCode.trim() });
                }
              })
              .catch(function() {
                setTrackedResult({ notFound: true, code: searchCode.trim() });
              })
              .finally(function() {
                setIsTracking(false);
              });
          };

          return h('div', { className: 'max-w-md mx-auto min-h-screen pb-20 bg-stone-100 flex flex-col' },
            // Header
            h('header', { className: 'sticky top-0 z-30 bg-white border-b border-stone-200 px-4 py-2.5 shadow-xs' },
              h('div', { className: 'flex items-center justify-between' },
                h('div', { className: 'flex items-center space-x-2' },
                  h('div', { className: 'w-8 h-8 rounded-xl bg-amber-400 p-0.5 border border-amber-500/40 flex items-center justify-center overflow-hidden' },
                    h('img', { src: '/logo.png', alt: 'Korcha', className: 'w-full h-full object-contain', onError: function(e) { e.target.style.display = 'none'; } })
                  ),
                  h('div', null,
                    h('h1', { className: 'text-sm font-extrabold text-stone-900 leading-none' }, 'KORCHA'),
                    h('p', { className: 'text-[10px] text-stone-500 font-medium' }, 'የውጭ ገበያ እቃ አቅራቢ')
                  )
                ),
                totalCartCount > 0 ? h('button', {
                  onClick: function() { setIsCartOpen(true); },
                  className: 'px-2.5 py-1.5 rounded-full bg-amber-500 text-stone-950 font-bold text-xs flex items-center space-x-1 shadow-xs cursor-pointer active:scale-95'
                }, '🛒 ' + totalCartCount) : null
              ),
              // Navigation
              h('div', { className: 'flex items-center justify-between border-t border-stone-100 mt-2 pt-1.5 gap-1.5' },
                h('button', {
                  onClick: function() { setQuoteMode('link'); setIsQuoteOpen(true); },
                  className: 'flex-1 py-1.5 rounded-lg font-bold text-xs flex items-center justify-center space-x-1 bg-amber-100 text-amber-950 border border-amber-300 active:scale-95 cursor-pointer shadow-xs'
                }, '🛍️ እዘዝ (Order)'),
                h('button', {
                  onClick: function() { setActiveTab('tracker'); },
                  className: 'flex-1 py-1.5 rounded-lg font-bold text-xs flex items-center justify-center space-x-1 active:scale-95 cursor-pointer ' + (activeTab === 'tracker' ? 'bg-amber-600 text-white' : 'bg-stone-100 text-stone-700 hover:bg-stone-200')
                }, '📦 ትዕዛዞች'),
                h('button', {
                  onClick: function() { setActiveTab('support'); },
                  className: 'flex-1 py-1.5 rounded-lg font-bold text-xs flex items-center justify-center space-x-1 active:scale-95 cursor-pointer ' + (activeTab === 'support' ? 'bg-amber-600 text-white' : 'bg-stone-100 text-stone-700 hover:bg-stone-200')
                }, '💬 መልዕክት')
              )
            ),

            // Main Content
            h('main', { className: 'p-3 space-y-3 flex-1' },
              activeTab === 'home' ? [
                // Hero Banner
                h('div', { key: 'hero', className: 'relative overflow-hidden rounded-2xl bg-gradient-to-br from-stone-950 via-stone-900 to-amber-950 text-white p-3.5 shadow-md border border-amber-900/30' },
                  h('div', { className: 'relative z-10 space-y-2' },
                    h('div', { className: 'flex items-center justify-between' },
                      h('span', { className: 'px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 text-[10px] font-bold border border-amber-500/30' }, '✨ የውጭ ገበያ እቃ አቅራቢ'),
                      h('span', { className: 'text-[9px] font-bold text-amber-300 bg-amber-900/60 px-2 py-0.5 rounded-md border border-amber-600/40' }, '40% ቅድመ ክፍያ • በብር')
                    ),
                    h('h2', { className: 'text-sm font-extrabold leading-snug' }, 'የፈለጉትን እቃ ይምረጡ፣ በርዎ ድረስ እናደርሳለን!'),
                    h('div', { className: 'grid grid-cols-2 gap-2 pt-1' },
                      h('button', {
                        onClick: function() { setQuoteMode('link'); setIsQuoteOpen(true); },
                        className: 'py-2 px-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-400 text-stone-950 font-black text-xs flex items-center justify-center space-x-1 active:scale-95 cursor-pointer shadow-xs'
                      }, '🔗 በሊንክ እዘዝ'),
                      h('button', {
                        onClick: function() { setQuoteMode('screenshot'); setIsQuoteOpen(true); },
                        className: 'py-2 px-2.5 rounded-xl bg-white/15 text-white font-bold text-xs flex items-center justify-center space-x-1 border border-white/20 active:scale-95 cursor-pointer'
                      }, '📸 በፎቶ እዘዝ')
                    )
                  )
                ),

                // Marketplaces
                h('div', { key: 'markets', className: 'bg-white rounded-xl p-2 border border-stone-200 space-y-1.5 shadow-2xs' },
                  h('div', { className: 'flex items-center justify-between text-[10px] font-bold text-stone-500 px-0.5' },
                    h('span', null, 'ዓለም አቀፍ ገበያዎች'),
                    h('span', { className: 'text-amber-700' }, 'ሊንክ ኮፒ አድርገው ይዘዙ')
                  ),
                  h('div', { className: 'grid grid-cols-3 gap-1' },
                    h('a', { href: 'https://www.aliexpress.com', target: '_blank', className: 'p-1.5 rounded-lg bg-stone-50 border border-stone-200 text-center hover:bg-amber-50' },
                      h('span', { className: 'block text-xs font-black text-amber-700' }, 'AliExpress'),
                      h('span', { className: 'block text-[8.5px] text-stone-500' }, 'ኤሌክትሮኒክስ')
                    ),
                    h('a', { href: 'https://www.shein.com', target: '_blank', className: 'p-1.5 rounded-lg bg-stone-50 border border-stone-200 text-center hover:bg-pink-50' },
                      h('span', { className: 'block text-xs font-black text-rose-600' }, 'Shein'),
                      h('span', { className: 'block text-[8.5px] text-stone-500' }, 'ፋሽን')
                    ),
                    h('a', { href: 'https://www.amazon.com', target: '_blank', className: 'p-1.5 rounded-lg bg-stone-50 border border-stone-200 text-center hover:bg-yellow-50' },
                      h('span', { className: 'block text-xs font-black text-amber-800' }, 'Amazon'),
                      h('span', { className: 'block text-[8.5px] text-stone-500' }, 'ሁሉም ዓይነት')
                    )
                  ),
                  h('a', {
                    href: 'https://mobile.yangkeduo.com',
                    target: '_blank',
                    className: 'block p-2 rounded-xl bg-gradient-to-r from-red-600 via-rose-600 to-amber-600 text-white font-extrabold text-xs text-center shadow-xs active:scale-95'
                  }, '🇨🇳 ከቻይና ገበያ የፈለጉትን ዕቃ ያምጡ (Pingodo Direct) →')
                ),

                // Regional Hubs
                h('div', { key: 'regions', className: 'bg-white rounded-xl p-2.5 border border-stone-200 space-y-2 shadow-2xs' },
                  h('div', { className: 'grid grid-cols-3 gap-1' },
                    [
                      { id: 'USA', name: 'USA Mart', flag: '🇺🇸' },
                      { id: 'ARABIAN', name: 'Arabian Mart', flag: '🇸🇦 🇦🇪' },
                      { id: 'KOREAN', name: 'Korean Mart', flag: '🇰🇷' }
                    ].map(function(r) {
                      return h('button', {
                        key: r.id,
                        onClick: function() { setSelectedRegion(r.id); },
                        className: 'py-1.5 px-1 rounded-xl text-center border transition-all cursor-pointer ' + (selectedRegion === r.id ? 'border-amber-500 bg-amber-500 text-stone-950 font-black shadow-xs' : 'border-stone-200 bg-stone-50 text-stone-700 font-bold')
                      },
                        h('span', { className: 'text-xs block leading-none' }, r.flag),
                        h('span', { className: 'text-[10px] block font-extrabold truncate mt-0.5' }, r.name)
                      );
                    })
                  ),
                  h('div', { className: 'pt-1 text-[11px]' },
                    selectedRegion === 'USA' ? h('div', { className: 'flex flex-wrap gap-1' },
                      ['Food', 'Supplements', 'Skin care products', 'Others'].map(function(cat) {
                        return h('button', {
                          key: cat,
                          onClick: function() { setQuoteMode('link'); setIsQuoteOpen(true); },
                          className: 'px-2 py-1 rounded-lg bg-stone-100 hover:bg-amber-100 text-stone-800 text-[10px] font-bold border border-stone-200'
                        }, cat);
                      })
                    ) : null,
                    selectedRegion === 'ARABIAN' ? h('div', { className: 'p-2 rounded-xl bg-amber-50 border border-amber-200 flex items-center justify-between' },
                      h('p', { className: 'text-[10px] text-amber-950 font-bold' }, '🇸🇦 🇦🇪 ማንኛውንም እቃ ለማስመጣት ሊንኩን ወይም ስክሪንሾቱን ይላኩልን'),
                      h('button', {
                        onClick: function() { setQuoteMode('screenshot'); setIsQuoteOpen(true); },
                        className: 'px-2 py-1 rounded-lg bg-amber-600 text-white font-bold text-[10px] shrink-0'
                      }, 'እዘዝ')
                    ) : null,
                    selectedRegion === 'KOREAN' ? h('div', { className: 'flex flex-wrap gap-1' },
                      ['Skin care products'].map(function(cat) {
                        return h('button', {
                          key: cat,
                          onClick: function() { setQuoteMode('link'); setIsQuoteOpen(true); },
                          className: 'px-2 py-1 rounded-lg bg-stone-100 hover:bg-pink-100 text-stone-800 text-[10px] font-bold border border-stone-200'
                        }, '🌸 ' + cat + ' (K-Beauty)');
                      })
                    ) : null
                  )
                ),

                // Shelf
                h('div', { key: 'shelf', className: 'space-y-1.5' },
                  h('div', { className: 'flex items-center justify-between px-0.5' },
                    h('h3', { className: 'text-xs font-black text-stone-900' }, 'የመደርደሪያ እቃዎች (Shelf Inventory)'),
                    h('span', { className: 'text-[10px] text-stone-500 font-medium' }, '100% ኦሪጅናል')
                  ),
                  h('div', { className: 'grid grid-cols-2 gap-2' },
                    products.map(function(p) {
                      return h('div', { key: p.id, className: 'bg-white rounded-xl border border-stone-200 overflow-hidden shadow-2xs flex flex-col justify-between' },
                        h('div', {
                          onClick: function() { setZoomedProduct(p); setActivePhotoIdx(0); },
                          className: 'relative aspect-square bg-stone-100 cursor-pointer overflow-hidden'
                        },
                          h('img', { src: p.photo_url, alt: p.name, className: 'w-full h-full object-cover' }),
                          p.is_bestseller ? h('span', { className: 'absolute top-1 left-1 bg-amber-500 text-stone-950 font-black text-[8px] px-1.5 py-0.2 rounded' }, 'ተወዳጅ') : null
                        ),
                        h('div', { className: 'p-2 space-y-1 flex flex-col justify-between flex-1' },
                          h('div', null,
                            h('h4', { className: 'font-extrabold text-[11px] text-stone-900 line-clamp-2 leading-tight' }, p.name),
                            p.size ? h('p', { className: 'text-[9px] text-stone-500' }, 'መጠን: ' + p.size) : null
                          ),
                          h('div', { className: 'pt-1 border-t border-stone-100 space-y-1' },
                            h('div', { className: 'flex items-baseline justify-between' },
                              h('span', { className: 'text-xs font-black text-amber-700' }, Number(p.price_etb).toLocaleString() + ' ETB')
                            ),
                            h('div', { className: 'grid grid-cols-2 gap-1' },
                              h('button', {
                                onClick: function() { addToCart(p); },
                                className: 'py-1 px-1 rounded-lg bg-amber-100 text-amber-950 font-bold text-[10px] flex items-center justify-center border border-amber-300'
                              }, '+ ጋሪ'),
                              h('button', {
                                onClick: function() { setQuoteMode('screenshot'); setIsQuoteOpen(true); },
                                className: 'py-1 px-1 rounded-lg bg-amber-500 text-stone-950 font-black text-[10px] flex items-center justify-center'
                              }, 'እዘዝ')
                            )
                          )
                        )
                      );
                    })
                  )
                )
              ] : null,

              // Tracker Tab
              activeTab === 'tracker' ? h('div', { className: 'bg-white rounded-2xl p-4 border border-stone-200 shadow-xs space-y-3' },
                h('h3', { className: 'font-extrabold text-sm text-stone-900' }, '📦 የትዕዛዝ ሁኔታ መከታተያ (Track Order)'),
                h('form', { onSubmit: handleTrack, className: 'flex gap-1.5' },
                  h('input', {
                    type: 'text',
                    value: searchCode,
                    onChange: function(e) { setSearchCode(e.target.value); },
                    placeholder: 'የኮድ ቁጥር (ምሳሌ፡ KC-123456)...',
                    className: 'flex-1 px-3 py-2 rounded-xl border border-stone-300 text-xs outline-none focus:ring-2 focus:ring-amber-500'
                  }),
                  h('button', { type: 'submit', className: 'px-4 py-2 rounded-xl bg-amber-500 text-stone-950 font-bold text-xs' }, isTracking ? '...' : 'ፈልግ')
                ),
                trackedResult ? h('div', { className: 'p-3 bg-stone-50 rounded-xl border border-stone-200 text-xs space-y-1' },
                  trackedResult.notFound ? h('p', { className: 'text-amber-800 font-bold' }, '⚠️ ምንም የተገኘ ትዕዛዝ የለም።') :
                  h('div', null,
                    h('p', null, '🏷️ ኮድ: ' + (trackedResult.ticket_code || trackedResult.code)),
                    h('p', null, '📊 ሁኔታ: ' + (trackedResult.status || 'በግምገማ ላይ'))
                  )
                ) : null
              ) : null,

              // Support Tab
              activeTab === 'support' ? h('div', { className: 'bg-white rounded-2xl p-4 border border-stone-200 shadow-xs text-center space-y-3' },
                h('h3', { className: 'font-extrabold text-sm text-stone-900' }, '💬 ከኮርቻ ሰራተኛ ጋር የቀጥታ ውይይት'),
                h('p', { className: 'text-xs text-stone-500' }, 'ጥያቄ ወይም አስተያየት ካለዎት ሰራተኞቻችን በቴሌግራም ዝግጁ ናቸው።'),
                h('a', {
                  href: 'https://t.me/korcha_support',
                  target: '_blank',
                  className: 'inline-block px-5 py-2.5 rounded-xl bg-amber-500 text-stone-950 font-bold text-xs shadow-md'
                }, '@korcha_support ን በቴሌግራም አውራ')
              ) : null
            ),

            // Persistent Floating Cart
            totalCartCount > 0 && !isCartOpen ? h('div', { className: 'fixed bottom-3 inset-x-3 max-w-md mx-auto z-40' },
              h('div', {
                onClick: function() { setIsCartOpen(true); },
                className: 'p-3 rounded-2xl bg-stone-900 text-white shadow-xl flex items-center justify-between cursor-pointer border border-amber-500/40'
              },
                h('span', { className: 'text-xs font-bold' }, '🛒 የግዢ ጋሪ (' + totalCartCount + ' እቃዎች)'),
                h('span', { className: 'text-xs font-black text-amber-400' }, totalCartPrice.toLocaleString() + ' ETB →')
              )
            ) : null,

            // Cart Drawer Modal
            isCartOpen ? h('div', { className: 'fixed inset-0 z-50 bg-stone-950/80 flex items-end justify-center' },
              h('div', { className: 'bg-white rounded-t-3xl max-w-md w-full p-4 space-y-3 max-h-[85vh] overflow-y-auto' },
                h('div', { className: 'flex items-center justify-between border-b pb-2' },
                  h('h3', { className: 'font-extrabold text-sm' }, 'የግዢ ጋሪ (Shopping Cart)'),
                  h('button', { onClick: function() { setIsCartOpen(false); }, className: 'font-bold text-stone-500' }, '✕')
                ),
                cart.map(function(item) {
                  return h('div', { key: item.product.id, className: 'flex items-center justify-between py-2 border-b' },
                    h('div', null,
                      h('p', { className: 'font-bold text-xs' }, item.product.name),
                      h('p', { className: 'text-xs text-amber-700' }, item.product.price_etb.toLocaleString() + ' ETB')
                    ),
                    h('div', { className: 'flex items-center space-x-2' },
                      h('button', { onClick: function() { updateCartQty(item.product.id, -1); }, className: 'w-6 h-6 rounded bg-stone-200 font-bold' }, '-'),
                      h('span', { className: 'text-xs font-bold' }, item.quantity),
                      h('button', { onClick: function() { updateCartQty(item.product.id, 1); }, className: 'w-6 h-6 rounded bg-amber-400 font-bold' }, '+')
                    )
                  );
                }),
                h('div', { className: 'pt-2' },
                  h('div', { className: 'flex justify-between font-extrabold text-sm' },
                    h('span', null, 'ጠቅላላ ዋጋ:'),
                    h('span', { className: 'text-amber-700' }, totalCartPrice.toLocaleString() + ' ETB')
                  ),
                  h('button', {
                    onClick: function() {
                      alert('✅ ትዕዛዝዎ ተመዝግቧል! ሰራተኛችን በቅርቡ ያነጋግርዎታል።');
                      setCart([]);
                      setIsCartOpen(false);
                    },
                    className: 'w-full mt-3 py-2.5 rounded-xl bg-amber-500 text-stone-950 font-black text-xs'
                  }, 'ትዕዛዙን አረጋግጥ (Checkout)')
                )
              )
            ) : null,

            // Quote Modal
            isQuoteOpen ? h('div', { className: 'fixed inset-0 z-50 bg-stone-950/80 flex items-center justify-center p-3' },
              h('div', { className: 'bg-white rounded-2xl max-w-sm w-full p-4 space-y-3' },
                h('div', { className: 'flex items-center justify-between' },
                  h('h3', { className: 'font-extrabold text-xs' }, quoteMode === 'link' ? '🔗 በሊንክ እዘዝ' : '📸 በፎቶ እዘዝ'),
                  h('button', { onClick: function() { setIsQuoteOpen(false); }, className: 'font-bold text-stone-500' }, '✕')
                ),
                h('form', {
                  onSubmit: function(e) {
                    e.preventDefault();
                    if (!orderPhone.trim()) { alert('እባክዎ ስልክ ቁጥር ያስገቡ'); return; }
                    alert('✅ የእቃ ማዘዣ ጥያቄዎ ደርሶናል! ሰራተኛችን ዋጋ አስልቶ ያሳውቅዎታል።');
                    setIsQuoteOpen(false);
                    setOrderPhone('');
                    setOrderSpecs('');
                  },
                  className: 'space-y-2.5 text-xs'
                },
                  quoteMode === 'link' ?
                    h('input', { type: 'url', required: true, placeholder: 'የእቃው ሊንክ (Shein, Amazon...)...', className: 'w-full px-3 py-2 rounded-xl border border-stone-300' }) :
                    h('input', { type: 'file', multiple: true, accept: 'image/*', required: true, className: 'w-full text-[11px]' }),
                  h('input', {
                    type: 'text',
                    value: orderSpecs,
                    onChange: function(e) { setOrderSpecs(e.target.value); },
                    placeholder: 'ብዛት፣ መጠንና ቀለም (Size, Color, Qty)...',
                    className: 'w-full px-3 py-2 rounded-xl border border-stone-300'
                  }),
                  h('input', {
                    type: 'tel',
                    required: true,
                    value: orderPhone,
                    onChange: function(e) { setOrderPhone(e.target.value); },
                    placeholder: 'የመገናኛ ስልክ ቁጥር (Phone)...',
                    className: 'w-full px-3 py-2 rounded-xl border border-stone-300'
                  }),
                  h('button', { type: 'submit', className: 'w-full py-2.5 rounded-xl bg-amber-500 text-stone-950 font-bold' }, 'ጥያቄውን ላክ (Submit)')
                )
              )
            ) : null,

            // Zoom Modal
            zoomedProduct ? h('div', { className: 'fixed inset-0 z-50 bg-stone-950/80 flex items-center justify-center p-3' },
              h('div', { className: 'bg-white rounded-2xl max-w-sm w-full p-4 space-y-3' },
                h('div', { className: 'flex items-center justify-between' },
                  h('h3', { className: 'font-extrabold text-xs line-clamp-1' }, zoomedProduct.name),
                  h('button', { onClick: function() { setZoomedProduct(null); }, className: 'font-bold text-stone-500' }, '✕')
                ),
                h('div', { className: 'aspect-square bg-stone-100 rounded-xl overflow-hidden' },
                  h('img', { src: zoomedProduct.photo_url, alt: '', className: 'w-full h-full object-contain' })
                ),
                zoomedProduct.description ? h('p', { className: 'text-xs text-stone-600' }, zoomedProduct.description) : null,
                h('div', { className: 'flex items-center justify-between pt-2 border-t' },
                  h('span', { className: 'font-black text-sm text-amber-700' }, zoomedProduct.price_etb.toLocaleString() + ' ETB'),
                  h('button', {
                    onClick: function() { addToCart(zoomedProduct); setZoomedProduct(null); },
                    className: 'px-4 py-2 rounded-xl bg-amber-500 text-stone-950 font-bold text-xs'
                  }, '+ ወደ ጋሪ ጨምር')
                )
              )
            ) : null
          );
        }

        const rootEl = document.getElementById('root');
        if (rootEl) {
          ReactDOM.createRoot(rootEl).render(h(KorchaApp));
        }
      })();
    </script>
  </body>
