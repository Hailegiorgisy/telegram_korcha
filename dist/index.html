              .then(function(data) {
                if (data.success) {
                  setPaymentAccounts({
                    telebirrPhone: data.telebirrPhone || '+251-996237800',
                    cbeAccount: data.cbeAccount || '10001116390'
                  });
                  if (Array.isArray(data.authorizedWorkers) && data.authorizedWorkers.length > 0) {
                    setWorkerAllowList(data.authorizedWorkers);
                  }
                }
              })
              .catch(function() {});

            fetch('/api/shelf')
              .then(function(res) { return res.json(); })
              .then(function(data) {
                if (data.products && data.products.length > 0) {
                  const validRemote = data.products.filter(function(p) {
                    return p && p.country && ['USA', 'KOREAN', 'ARABIAN'].indexOf(p.country.toUpperCase()) !== -1;
                  }).map(function(p) {
                    return Object.assign({}, p, {
                      country: p.country.toUpperCase(),
                      photos: (p.photos && p.photos.length > 0) ? p.photos : (p.photo_url ? [p.photo_url] : [])
                    });
                  });
                  if (validRemote.length > 0) {
                    setProducts(function(prev) {
                      const existingIds = new Set(validRemote.map(function(p) { return p.id; }));
                      return validRemote.concat(prev.filter(function(p) { return !existingIds.has(p.id); }));
                    });
                  }
                }
              })
              .catch(function() {});
          }, []);

          // Sync cart
          useEffect(function() {
            try { localStorage.setItem('korcha_cart', JSON.stringify(cart)); } catch (e) {}
          }, [cart]);

          const addToCart = function(product) {
            setCart(function(prev) {
              const exist = prev.find(function(i) { return i.product.id === product.id; });
              if (exist) {
                return prev.map(function(i) {
                  return i.product.id === product.id ? Object.assign({}, i, { quantity: i.quantity + 1 }) : i;
                });
              }
              return prev.concat([{ product: product, quantity: 1 }]);
            });
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
              window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }
          };

          const updateCartQty = function(id, delta) {
            setCart(function(prev) {
              return prev.map(function(i) {
                if (i.product.id === id) {
                  const q = i.quantity + delta;
                  return q > 0 ? Object.assign({}, i, { quantity: q }) : null;
                }
                return i;
              }).filter(Boolean);
            });
          };

          const totalCartPrice = cart.reduce(function(s, i) { return s + (i.product.price_etb * i.quantity); }, 0);
          const totalCartCount = cart.reduce(function(s, i) { return s + i.quantity; }, 0);

          // Filter in-stock products for the 3 Regional Marts
          const activeRegionObj = THREE_REGIONS.find(function(r) { return r.id === selectedRegion; }) || THREE_REGIONS[0];
          const inStockRegionProducts = products.filter(function(p) {
            const isReg = (p.country || '').toUpperCase() === selectedRegion.toUpperCase();
            if (!isReg) return false;
            if (regionCategory === 'All') return true;
            if (regionCategory === 'Most Sales') return Boolean(p.is_bestseller);
            if (regionCategory === 'Available') return true;
            return p.category && p.category.toLowerCase() === regionCategory.toLowerCase();
          });

          // Worker CRUD handlers
          const handleSaveNewProduct = function(e) {
            e.preventDefault();
            if (!newProdName.trim() || !newProdPrice) {
              alert('እባክዎ የእቃውን ስም እና ዋጋ ያስገቡ');
              return;
            }
            const photoList = newProdPhotosStr.trim()
              ? newProdPhotosStr.split(',').map(function(s) { return s.trim(); }).filter(Boolean)
              : [newProdPhoto.trim() || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=80'];

            const p = {
              id: Date.now(),
              name: newProdName.trim(),
              country: newProdCountry,
              category: newProdCategory,
              price_etb: parseFloat(newProdPrice),
              size: newProdSize.trim() || 'Standard',
              photo_url: photoList[0],
              photos: photoList,
              description: newProdDesc.trim() || 'በእጃችን ያለ ኦሪጅናል እቃ። ወዲያውኑ ማዘዝ ይችላሉ።',
              is_bestseller: false
            };
            setProducts(function(prev) { return [p].concat(prev); });
            fetch('/api/shelf/products', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(p)
            }).catch(function() {});
            alert('✅ አዲስ እቃ መደርደሪያው ላይ ተጨምሯል!');
            setIsAddProductOpen(false);
            setNewProdName('');
            setNewProdPrice('');
            setNewProdPhoto('');
            setNewProdPhotosStr('');
            setNewProdDesc('');
          };

          const handleDeleteProduct = function(id) {
            if (!confirm('ይህንን እቃ ከመደርደሪያው ላይ ማጥፋት ይፈልጋሉ?')) return;
            setProducts(function(prev) { return prev.filter(function(p) { return p.id !== id; }); });
            fetch('/api/shelf/products/' + id, { method: 'DELETE' }).catch(function() {});
          };

          const handleUpdateProduct = function(e) {
            e.preventDefault();
            if (!editingProduct) return;
            setProducts(function(prev) {
              return prev.map(function(p) {
                return p.id === editingProduct.id ? editingProduct : p;
              });
            });
            fetch('/api/shelf/products/' + editingProduct.id, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(editingProduct)
            }).catch(function() {});
            alert('✅ የእቃው መረጃ ተስተካክሏል!');
            setEditingProduct(null);
          };

          // Chat send handler
          const handleSendChatMessage = function(e) {
            e.preventDefault();
            if (!newMsgText.trim()) return;
            const msg = {
              id: Date.now(),
              sender: 'customer',
              text: newMsgText.trim(),
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            setChatMessages(function(prev) { return prev.concat([msg]); });
            setNewMsgText('');
            fetch('/api/quotes', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                phone: chatPhone || tgCustomerUsername || '0911000000',
                telegramUsername: tgCustomerUsername,
                telegramChatId: tgChatId,
                details: '[Live Chat] ' + msg.text
              })
            }).catch(function() {});
          };

          // Submit Direct In-Stock Order -> Open Payment & Receipt Step
          const handleConfirmDirectOrder = function(e) {
            e.preventDefault();
            if (!directOrderPhone.trim()) { alert('እባክዎ ስልክ ቁጥር ያስገቡ'); return; }
            const total = directOrderProduct.price_etb * directOrderQty;
            const deposit = Math.round(total * 0.4);
            const fallbackCode = 'KC-' + Math.floor(100000 + Math.random() * 900000);
            const chosenPhone = directOrderPhone.trim();
            const chosenMethod = directOrderPayment;

            fetch('/api/shelf/order', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                phone: chosenPhone,
                telegramUsername: tgCustomerUsername,
                telegramChatId: tgChatId,
                productName: directOrderProduct.name + ' (Qty: ' + directOrderQty + ')',
                priceEtb: total,
                paymentMethod: chosenMethod
              })
            })
              .then(function(res) { return res.json(); })
              .then(function(data) {
                if (data.paymentInfo) setPaymentAccounts(data.paymentInfo);
                setPaymentSession({
                  orderCode: data.orderCode || fallbackCode,
                  total: total,
                  deposit: deposit,
                  paymentMethod: chosenMethod,
                  phone: chosenPhone,
                  productName: directOrderProduct.name + ' (Qty: ' + directOrderQty + ')',
                  productType: directOrderProduct.category || 'General',
                  country: directOrderProduct.country || 'USA',
                  productPhoto: (directOrderProduct.photos && directOrderProduct.photos[0]) || directOrderProduct.photo_url || '',
                  submitted: false,
                  confirmationText: ''
                });
              })
              .catch(function() {
                setPaymentSession({
                  orderCode: fallbackCode,
                  total: total,
                  deposit: deposit,
                  paymentMethod: chosenMethod,
                  phone: chosenPhone,
                  productName: directOrderProduct.name + ' (Qty: ' + directOrderQty + ')',
                  productType: directOrderProduct.category || 'General',
                  country: directOrderProduct.country || 'USA',
                  productPhoto: (directOrderProduct.photos && directOrderProduct.photos[0]) || directOrderProduct.photo_url || '',
                  submitted: false,
                  confirmationText: ''
                });
              });

            setDirectOrderProduct(null);
            setDirectOrderPhone('');
            setDirectOrderQty(1);
          };

          const handleSubmitReceipt = function(e) {
            e.preventDefault();
            if (!paymentSession) return;
            if (!receiptFile && !transactionRef.trim()) {
              alert('እባክዎ የክፍያ ደረሰኝ ፎቶ ይምረጡ ወይም የTransaction Ref ቁጥር ያስገቡ');
              return;
            }
            setIsSubmittingReceipt(true);
            const fd = new FormData();
            fd.append('orderCode', paymentSession.orderCode);
            fd.append('paymentMethod', paymentSession.paymentMethod);
            fd.append('phone', paymentSession.phone);
            fd.append('productName', paymentSession.productName || '');
            fd.append('productType', paymentSession.productType || '');
            fd.append('country', paymentSession.country || '');
            fd.append('productPhoto', paymentSession.productPhoto || '');
            fd.append('totalPriceEtb', String(paymentSession.total || 0));
            fd.append('depositEtb', String(paymentSession.deposit || 0));
            fd.append('transactionRef', transactionRef.trim());
            fd.append('telegramUsername', tgCustomerUsername);
            if (tgChatId) fd.append('telegramChatId', String(tgChatId));
            if (receiptFile) fd.append('receipt', receiptFile);

            fetch('/api/shelf/receipt', {
              method: 'POST',
              body: fd
            })
              .then(function(res) { return res.json(); })
              .then(function(data) {
                setPaymentSession(Object.assign({}, paymentSession, {
                  submitted: true,
                  confirmationText: data.message || '✅ የክፍያ ደረሰኝዎ በተሳካ ሁኔታ ተልኳል! ሰራተኛችን አረጋግጦ በቅርቡ ያነጋግርዎታል።'
                }));
                setReceiptFile(null);
                setTransactionRef('');
              })
              .catch(function() {
                setPaymentSession(Object.assign({}, paymentSession, {
                  submitted: true,
                  confirmationText: '✅ የክፍያ ደረሰኝዎ ተልኳል! ሰራተኛችን በቅርቡ ያነጋግርዎታል።'
                }));
              })
              .finally(function() {
                setIsSubmittingReceipt(false);
              });
          };

          // Render Product Card with Multi-Photo Sliding Carousel
          const renderProductCard = function(p) {
            const photoList = (p.photos && p.photos.length > 0) ? p.photos : [p.photo_url];
            const currentIdx = cardPhotoIndexes[p.id] || 0;
            const activePhoto = photoList[currentIdx] || p.photo_url;

            const nextPhoto = function(e) {
              e.stopPropagation();
              const next = (currentIdx + 1) % photoList.length;
              setCardPhotoIndexes(function(prev) { return Object.assign({}, prev, { [p.id]: next }); });
            };

            const prevPhoto = function(e) {
              e.stopPropagation();
              const prevIdx = (currentIdx - 1 + photoList.length) % photoList.length;
              setCardPhotoIndexes(function(prev) { return Object.assign({}, prev, { [p.id]: prevIdx }); });
            };

            return h('div', { key: p.id, className: 'bg-white rounded-xl border border-stone-200 overflow-hidden shadow-2xs flex flex-col justify-between' },
              // Sliding Photo Carousel Header
              h('div', {
                onClick: function() {
                  setZoomedProduct(p);
                  setZoomPhotoIdx(currentIdx);
                  setZoomScale(1);
                },
                className: 'relative aspect-square bg-stone-100 cursor-pointer overflow-hidden group'
              },
                h('img', {
                  src: activePhoto,
                  alt: p.name,
                  className: 'w-full h-full object-cover transition-transform duration-200'
                }),

                // Bestseller Badge
                p.is_bestseller ? h('span', { className: 'absolute top-1.5 left-1.5 bg-amber-500 text-stone-950 font-black text-[8px] px-1.5 py-0.2 rounded shadow-xs' }, 'ተወዳጅ') : null,

                // Multi-Photo Carousel Navigation Arrows
                photoList.length > 1 ? [
                  h('button', {
                    key: 'prev',
                    onClick: prevPhoto,
                    className: 'absolute left-1 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-stone-900/60 text-white font-black text-xs flex items-center justify-center hover:bg-stone-900'
                  }, '‹'),
                  h('button', {
                    key: 'next',
                    onClick: nextPhoto,
                    className: 'absolute right-1 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-stone-900/60 text-white font-black text-xs flex items-center justify-center hover:bg-stone-900'
                  }, '›'),
                  h('div', { key: 'dots', className: 'absolute bottom-1 inset-x-0 flex items-center justify-center space-x-1' },
                    photoList.map(function(_, dotIdx) {
                      return h('span', {
                        key: dotIdx,
                        className: 'w-1.5 h-1.5 rounded-full ' + (dotIdx === currentIdx ? 'bg-amber-400' : 'bg-white/70')
                      });
                    })
                  )
                ] : null,

                // Zoom Indicator
                h('span', { className: 'absolute top-1.5 right-1.5 bg-stone-900/70 text-white text-[8px] px-1.5 py-0.5 rounded font-bold' },
                  '🔍 ' + (currentIdx + 1) + '/' + photoList.length
                )
              ),

              // Product Info & Controls
              h('div', { className: 'p-2 space-y-1 flex flex-col justify-between flex-1' },
                h('div', {
                  onClick: function() { setZoomedProduct(p); setZoomPhotoIdx(currentIdx); setZoomScale(1); },
                  className: 'cursor-pointer'
                },
                  h('h4', { className: 'font-extrabold text-[11px] text-stone-900 line-clamp-2 leading-tight' }, p.name),
                  p.size ? h('p', { className: 'text-[9px] text-stone-500 mt-0.5' }, 'መጠን: ', h('b', null, p.size)) : null,
                  p.description ? h('p', { className: 'text-[9.5px] text-stone-500 line-clamp-1 mt-0.5 leading-snug' }, p.description) : null
                ),

                h('div', { className: 'pt-1.5 border-t border-stone-100 space-y-1' },
                  h('div', { className: 'flex items-baseline justify-between' },
                    h('span', { className: 'text-xs font-black text-amber-700' }, Number(p.price_etb).toLocaleString() + ' ETB'),
                    !isWorkerModeActive ? h('span', { className: 'text-[8.5px] text-emerald-800 font-bold' }, 'በእጃችን ያለ') : null
                  ),

                  // ROLE-BASED ACTIONS:
                  isWorkerModeActive ? (
                    h('div', { className: 'grid grid-cols-2 gap-1 pt-0.5' },
                      h('button', {
                        onClick: function() { setEditingProduct(Object.assign({}, p)); },
                        className: 'py-1 px-1 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-900 font-bold text-[10px] border border-amber-300'
                      }, '✏️ አርም'),
                      h('button', {
                        onClick: function() { handleDeleteProduct(p.id); },
                        className: 'py-1 px-1 rounded-lg bg-red-50 hover:bg-red-100 text-red-700 font-bold text-[10px] border border-red-200'
                      }, '🗑️ አጥፋ')
                    )
                  ) : (
                    h('div', { className: 'grid grid-cols-2 gap-1 pt-0.5' },
                      h('button', {
                        onClick: function() { addToCart(p); },
                        className: 'py-1 px-1 rounded-lg bg-amber-100 hover:bg-amber-200 text-amber-950 font-bold text-[10px] flex items-center justify-center border border-amber-300'
                      }, '+ ካርት'),
                      h('button', {
                        onClick: function() {
                          setDirectOrderProduct(p);
                          setDirectOrderQty(1);
                        },
                        className: 'py-1 px-1 rounded-lg bg-amber-500 hover:bg-amber-400 text-stone-950 font-black text-[10px] shadow-xs'
                      }, 'እዘዝ (Order)')
                    )
                  )
                )
              )
            );
          };

          return h('div', { className: 'max-w-md mx-auto min-h-screen pb-20 bg-stone-100 flex flex-col' },
            // App Header
            h('header', { className: 'sticky top-0 z-30 bg-white border-b border-stone-200 px-4 py-2.5 shadow-xs' },
              h('div', { className: 'flex items-center justify-between' },
                h('div', { className: 'flex items-center space-x-2' },
                  h('div', { className: 'w-8 h-8 rounded-xl bg-amber-400 p-0.5 border border-amber-500/40 flex items-center justify-center overflow-hidden' },
                    h('img', { src: '/logo.png', alt: 'Korcha', className: 'w-full h-full object-contain', onError: function(e) { e.target.style.display = 'none'; } })
                  ),
                  h('div', null,
                    h('h1', { className: 'text-sm font-extrabold text-stone-900 leading-none' }, 'KORCHA'),
                    h('p', { className: 'text-[10px] text-stone-500 font-medium' }, isWorkerModeActive ? 'የሰራተኛ መቆጣጠሪያ ማዕከል' : 'telegram.korcha.com.et')
                  )
                ),

                h('div', { className: 'flex items-center space-x-1.5' },
                  isAuthorizedWorker ? h('button', {
                    onClick: function() { setWorkerPreviewCustomer(!workerPreviewCustomer); },
                    className: 'px-2 py-1 rounded-lg text-[10px] font-bold border transition-all ' + (isWorkerModeActive ? 'bg-stone-900 text-amber-300 border-amber-500' : 'bg-amber-100 text-amber-900 border-amber-300')
                  }, isWorkerModeActive ? '🛠️ ሰራተኛ ሞድ' : '👁️ ደንበኛ እይታ') : null,

                  !isWorkerModeActive && totalCartCount > 0 ? h('button', {
                    onClick: function() { setIsCartOpen(true); },
                    className: 'px-2.5 py-1.5 rounded-full bg-amber-500 text-stone-950 font-bold text-xs flex items-center space-x-1 shadow-xs cursor-pointer active:scale-95'
                  }, '🛒 ' + totalCartCount) : null
                )
              ),

              // Navigation Tabs (shop, orders, chat)
              h('div', { className: 'flex items-center justify-between border-t border-stone-100 mt-2 pt-1.5 gap-1.5' },
                h('button', {
                  onClick: function() { setActiveTab('home'); },
                  className: 'flex-1 py-1.5 rounded-lg font-bold text-xs flex items-center justify-center space-x-1 cursor-pointer ' + (activeTab === 'home' ? 'bg-amber-500 text-stone-950 font-black shadow-xs' : 'bg-stone-100 text-stone-700 hover:bg-stone-200')
                }, isWorkerModeActive ? '📦 መደርደሪያ አስተዳድር' : '🛍️ መደርደሪያ (Shop)'),

                h('button', {
                  onClick: function() { setActiveTab('tracker'); },
                  className: 'flex-1 py-1.5 rounded-lg font-bold text-xs flex items-center justify-center space-x-1 cursor-pointer ' + (activeTab === 'tracker' ? 'bg-amber-600 text-white shadow-xs' : 'bg-stone-100 text-stone-700 hover:bg-stone-200')
                }, '📦 ትዕዛዞች'),

                h('button', {
                  onClick: function() { setActiveTab('support'); },
                  className: 'flex-1 py-1.5 rounded-lg font-bold text-xs flex items-center justify-center space-x-1 cursor-pointer ' + (activeTab === 'support' ? 'bg-amber-600 text-white shadow-xs' : 'bg-stone-100 text-stone-700 hover:bg-stone-200')
                }, '💬 መልዕክት (Chat)')
              )
            ),

            // Main Content Area
            h('main', { className: 'p-3 space-y-3.5 flex-1' },
              activeTab === 'home' ? [
                // Worker Admin Banner
                isWorkerModeActive ? h('div', { key: 'worker-bar', className: 'p-3 rounded-2xl bg-gradient-to-r from-stone-900 to-amber-950 text-white border border-amber-500/40 space-y-2' },
                  h('div', { className: 'flex items-center justify-between' },
                    h('span', { className: 'px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 text-[10px] font-bold border border-amber-500/40' }, '🛠️ የሰራተኛ መደርደሪያ መቆጣጠሪያ'),
                    h('span', { className: 'text-[10px] text-amber-400 font-bold' }, '@korcha_support')
                  ),
                  h('p', { className: 'text-xs text-stone-300' }, 'በእጃችን ያሉ እቃዎችን ይጫኑ፣ ዋጋ ይቀይሩ እና ከመደርደሪያ ያጥፉ።'),
                  h('button', {
                    onClick: function() {
                      setNewProdCountry(selectedRegion);
                      setNewProdCategory(activeRegionObj.categories[3] || 'Food');
                      setIsAddProductOpen(true);
                    },
                    className: 'w-full py-2 px-3 rounded-xl bg-amber-400 text-stone-950 font-black text-xs shadow-xs cursor-pointer'
                  }, '+ አዲስ እቃ ወደ ' + activeRegionObj.name + ' መደርደሪያ ጨምር')
                ) : null,

                // ==========================================
                // REQUIREMENT 1: 3 MARKETPLACES JUST BELOW NAV (ALIEXPRESS, SHEIN, AMAZON)
                // Smallest as possible, linking to Play Store & App Store
                // ==========================================
                h('div', { key: 'marketplaces-strip', className: 'bg-white rounded-xl p-2 border border-stone-200 space-y-1 shadow-2xs' },
                  h('div', { className: 'flex items-center justify-between text-[9px] font-bold text-stone-500 px-0.5' },
                    h('span', null, 'ዓለም አቀፍ ገበያዎች (Global Marketplaces)'),
                    h('span', { className: 'text-amber-700' }, 'መተግበሪያውን ያውርዱ')
                  ),
                  h('div', { className: 'grid grid-cols-3 gap-1' },
                    // 1. AliExpress
                    h('div', { className: 'p-1 rounded-lg bg-stone-50 border border-stone-200 text-center' },
                      h('span', { className: 'block text-[11px] font-black text-amber-700 leading-tight' }, 'AliExpress'),

                    h('div', { className: 'flex justify-between' },
                      h('span', null, 'ጠቅላላ ዋጋ:'),
                      h('span', { className: 'text-amber-800 font-black' }, (directOrderProduct.price_etb * directOrderQty).toLocaleString() + ' ETB')
                    ),
                    h('div', { className: 'flex justify-between text-emerald-800' },
                      h('span', null, '40% ቅድመ ክፍያ:'),
                      h('span', { className: 'font-black' }, Math.round(directOrderProduct.price_etb * directOrderQty * 0.4).toLocaleString() + ' ETB')
                    )
                  ),
                  h('button', { type: 'submit', className: 'w-full py-2.5 rounded-xl bg-amber-500 text-stone-950 font-black' }, 'ትዕዛዝ አረጋግጥ (Confirm Order)')
                )
              )
            ) : null,

            // Payment & Receipt Submission Modal (Uses .env Telebirr / CBE accounts)
            paymentSession ? h('div', { className: 'fixed inset-0 z-50 bg-stone-950/80 flex items-center justify-center p-3' },
              h('div', { className: 'bg-white rounded-2xl max-w-sm w-full p-4 space-y-3' },
                h('div', { className: 'flex items-center justify-between border-b pb-2' },
                  h('h3', { className: 'font-extrabold text-xs text-stone-900' }, '💳 ክፍያ እና ደረሰኝ ማስገቢያ (Pay & Submit Receipt)'),
                  h('button', { onClick: function() { setPaymentSession(null); }, className: 'font-bold text-stone-500' }, '✕')
                ),
                paymentSession.submitted ? h('div', { className: 'p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-center space-y-2' },
                  h('p', { className: 'text-sm font-black text-emerald-800' }, '✅ ክፍያዎ ተልኳል!'),
                  h('p', { className: 'text-xs text-stone-700' }, paymentSession.confirmationText),
                  h('p', { className: 'text-[11px] font-bold text-stone-600' }, 'የትዕዛዝ ኮድ: ' + paymentSession.orderCode),
                  h('button', {
                    onClick: function() { setPaymentSession(null); },
                    className: 'w-full mt-2 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs'
                  }, 'ዝጋ (Done)')
                ) : h('form', { onSubmit: handleSubmitReceipt, className: 'space-y-2.5 text-xs' },
                  h('div', { className: 'p-2.5 bg-amber-50 rounded-xl border border-amber-200 space-y-1' },
                    h('p', { className: 'font-bold text-stone-800' }, '🏷️ የትዕዛዝ ኮድ: ' + paymentSession.orderCode),
                    h('p', { className: 'font-bold text-emerald-800' }, '💰 የሚከፈል 40% ቅድመ ክፍያ: ' + paymentSession.deposit.toLocaleString() + ' ETB (ጠቅላላ: ' + paymentSession.total.toLocaleString() + ' ETB)'),
                    h('div', { className: 'pt-1 border-t border-amber-200/70' },
                      paymentSession.paymentMethod === 'telebirr'
                        ? h('p', { className: 'font-black text-amber-900' }, '📱 Telebirr ቁጥር: ' + paymentAccounts.telebirrPhone)
                        : h('p', { className: 'font-black text-amber-900' }, '🏦 CBE ሂሳብ ቁጥር: ' + paymentAccounts.cbeAccount)
                    )
                  ),
                  tgCustomerUsername ? h('p', { className: 'text-[10px] text-emerald-700 font-bold' }, '✓ Telegram ተጠቃሚ: ' + tgCustomerUsername) : null,
                  h('div', { className: 'space-y-1' },
                    h('label', { className: 'font-bold text-stone-700 block' }, '📸 የክፍያ ደረሰኝ ስክሪንሾት (Receipt Image):'),
                    h('input', {
                      type: 'file',
                      accept: 'image/*',
                      onChange: function(e) { setReceiptFile(e.target.files && e.target.files[0] ? e.target.files[0] : null); },
                      className: 'w-full text-[11px] p-1.5 border border-stone-300 rounded-lg'
                    })
                  ),
                  h('input', {
                    type: 'text',
                    value: transactionRef,
                    onChange: function(e) { setTransactionRef(e.target.value); },
                    placeholder: 'የTransaction / Ref ቁጥር (ካለዎት)...',
                    className: 'w-full p-2.5 rounded-xl border border-stone-300'
                  }),
                  h('button', {
                    type: 'submit',
                    disabled: isSubmittingReceipt,
                    className: 'w-full py-2.5 rounded-xl bg-emerald-600 text-white font-black'
                  }, isSubmittingReceipt ? 'በመላክ ላይ...' : 'ደረሰኝ ላክ (Submit Receipt)')
                )
              )
            ) : null,

            // Sourcing Quote Modal
            isQuoteOpen ? h('div', { className: 'fixed inset-0 z-50 bg-stone-950/80 flex items-center justify-center p-3' },
              h('div', { className: 'bg-white rounded-2xl max-w-sm w-full p-4 space-y-3' },
                h('div', { className: 'flex items-center justify-between' },
                  h('h3', { className: 'font-extrabold text-xs' }, quoteMode === 'link' ? '🔗 በሊንክ እዘዝ' : '📸 በፎቶ እዘዝ'),
                  h('button', { onClick: function() { setIsQuoteOpen(false); }, className: 'font-bold text-stone-500' }, '✕')
                ),
                h('form', {
                  onSubmit: function(e) {
                    e.preventDefault();
                    if (!quotePhone.trim()) { alert('እባክዎ ስልክ ቁጥር ያስገቡ'); return; }
                    alert('✅ የእቃ ማዘዣ ጥያቄዎ ደርሶናል! ሰራተኛችን ዋጋ አስልቶ ያሳውቅዎታል።');
                    setIsQuoteOpen(false);
                    setQuotePhone('');
                    setQuoteSpecs('');
                    setQuoteUrl('');
                  },
                  className: 'space-y-2.5 text-xs'
                },
                  h('div', { className: 'text-[11px] font-bold text-amber-800 bg-amber-50 p-2 rounded-lg' },
                    'መነሻ ገበያ፡ ' + (quoteSite || 'International')
                  ),
                  quoteMode === 'link' ?
                    h('input', {
                      type: 'url',
                      required: true,
                      value: quoteUrl,
                      onChange: function(e) { setQuoteUrl(e.target.value); },
                      placeholder: 'የእቃው ሊንክ (Link)...',
                      className: 'w-full px-3 py-2 rounded-xl border border-stone-300'
                    }) :
                    h('input', { type: 'file', multiple: true, accept: 'image/*', required: true, className: 'w-full text-[11px]' }),
                  h('input', {
                    type: 'text',
                    value: quoteSpecs,
                    onChange: function(e) { setQuoteSpecs(e.target.value); },
                    placeholder: 'ብዛት፣ መጠንና ቀለም (Size, Color, Qty)...',
                    className: 'w-full px-3 py-2 rounded-xl border border-stone-300'
                  }),
                  h('input', {
                    type: 'tel',
                    required: true,
                    value: quotePhone,
                    onChange: function(e) { setQuotePhone(e.target.value); },
                    placeholder: 'የመገናኛ ስልክ ቁጥር (Phone)...',
                    className: 'w-full px-3 py-2 rounded-xl border border-stone-300'
                  }),
                  h('button', { type: 'submit', className: 'w-full py-2.5 rounded-xl bg-amber-500 text-stone-950 font-bold' }, 'ጥያቄውን ላክ (Submit)')
                )
              )
            ) : null,

            // Worker: Add Product Modal
            isAddProductOpen ? h('div', { className: 'fixed inset-0 z-50 bg-stone-950/80 flex items-center justify-center p-3' },
              h('div', { className: 'bg-white rounded-2xl max-w-sm w-full p-4 space-y-3 max-h-[90vh] overflow-y-auto' },
                h('div', { className: 'flex items-center justify-between' },
                  h('h3', { className: 'font-extrabold text-xs text-stone-900' }, '+ አዲስ እቃ ወደ መደርደሪያ ጨምር'),
                  h('button', { onClick: function() { setIsAddProductOpen(false); }, className: 'font-bold text-stone-500' }, '✕')
                ),
                h('form', { onSubmit: handleSaveNewProduct, className: 'space-y-2 text-xs' },
                  h('div', { className: 'grid grid-cols-2 gap-1.5' },
                    h('select', {
                      value: newProdCountry,
                      onChange: function(e) { setNewProdCountry(e.target.value); },
                      className: 'p-2 rounded-lg border border-stone-300 font-bold'
                    },
                      h('option', { value: 'USA' }, '🇺🇸 USA Mart'),
                      h('option', { value: 'ARABIAN' }, '🇸🇦 🇦🇪 Arabian Mart'),
                      h('option', { value: 'KOREAN' }, '🇰🇷 Korean Mart')
                    ),
                    h('select', {
                      value: newProdCategory,
                      onChange: function(e) { setNewProdCategory(e.target.value); },
                      className: 'p-2 rounded-lg border border-stone-300 font-bold'
                    },
                      (THREE_REGIONS.find(function(r) { return r.id === newProdCountry; }) || THREE_REGIONS[0]).categories
                        .filter(function(c) { return ['All', 'Most Sales', 'Available'].indexOf(c) === -1; })
                        .map(function(c) { return h('option', { key: c, value: c }, c); })
                    )
                  ),
                  h('input', {
                    type: 'text',
                    required: true,
                    placeholder: 'የእቃው ስም (Product Name)...',
                    value: newProdName,
                    onChange: function(e) { setNewProdName(e.target.value); },
                    className: 'w-full p-2 rounded-lg border border-stone-300'
                  }),
                  h('div', { className: 'grid grid-cols-2 gap-1.5' },
                    h('input', {
                      type: 'number',
                      required: true,
                      placeholder: 'ዋጋ በብር (ETB)...',
                      value: newProdPrice,
                      onChange: function(e) { setNewProdPrice(e.target.value); },
                      className: 'p-2 rounded-lg border border-stone-300 font-bold text-amber-700'
                    }),
                    h('input', {
                      type: 'text',
                      placeholder: 'መጠን (Size)...',
                      value: newProdSize,
                      onChange: function(e) { setNewProdSize(e.target.value); },
                      className: 'p-2 rounded-lg border border-stone-300'
                    })
                  ),
                  h('input', {
                    type: 'url',
                    placeholder: 'ዋና የፎቶ ሊንክ (Main Photo URL)...',
                    value: newProdPhoto,
                    onChange: function(e) { setNewProdPhoto(e.target.value); },
                    className: 'w-full p-2 rounded-lg border border-stone-300'
                  }),
                  h('input', {
                    type: 'text',
                    placeholder: 'ተጨማሪ ፎቶዎች በኮማ ተለይተው (URL 1, URL 2)...',
                    value: newProdPhotosStr,
                    onChange: function(e) { setNewProdPhotosStr(e.target.value); },
                    className: 'w-full p-2 rounded-lg border border-stone-300'
                  }),
                  h('textarea', {
                    placeholder: 'አጭር መግለጫ (Description)...',
                    value: newProdDesc,
                    onChange: function(e) { setNewProdDesc(e.target.value); },
                    className: 'w-full p-2 rounded-lg border border-stone-300 h-16'
                  }),
                  h('button', { type: 'submit', className: 'w-full py-2.5 rounded-xl bg-amber-500 text-stone-950 font-black' }, 'መደርደሪያ ላይ ጫን (Publish)')
                )
              )
            ) : null,

            // Worker: Edit Product Modal
            editingProduct ? h('div', { className: 'fixed inset-0 z-50 bg-stone-950/80 flex items-center justify-center p-3' },
              h('div', { className: 'bg-white rounded-2xl max-w-sm w-full p-4 space-y-3' },
                h('div', { className: 'flex items-center justify-between' },
                  h('h3', { className: 'font-extrabold text-xs' }, 'እቃውን አርም (Edit Product)'),
                  h('button', { onClick: function() { setEditingProduct(null); }, className: 'font-bold text-stone-500' }, '✕')
                ),
                h('form', { onSubmit: handleUpdateProduct, className: 'space-y-2 text-xs' },
                  h('input', {
                    type: 'text',
                    value: editingProduct.name,
                    onChange: function(e) { setEditingProduct(Object.assign({}, editingProduct, { name: e.target.value })); },
                    className: 'w-full p-2 rounded-lg border border-stone-300'
                  }),
                  h('div', { className: 'grid grid-cols-2 gap-1.5' },
                    h('input', {
                      type: 'number',
                      value: editingProduct.price_etb,
                      onChange: function(e) { setEditingProduct(Object.assign({}, editingProduct, { price_etb: parseFloat(e.target.value) })); },
                      className: 'p-2 rounded-lg border border-stone-300 font-bold text-amber-700'
                    }),
                    h('input', {
                      type: 'text',
                      value: editingProduct.size || '',
                      onChange: function(e) { setEditingProduct(Object.assign({}, editingProduct, { size: e.target.value })); },
                      className: 'p-2 rounded-lg border border-stone-300'
                    })
                  ),
                  h('textarea', {
                    value: editingProduct.description || '',
                    onChange: function(e) { setEditingProduct(Object.assign({}, editingProduct, { description: e.target.value })); },
                    className: 'w-full p-2 rounded-lg border border-stone-300 h-16'
                  }),
                  h('button', { type: 'submit', className: 'w-full py-2.5 rounded-xl bg-amber-500 text-stone-950 font-black' }, 'ለውጦችን መዝግብ (Save)')
                )
              )
            ) : null,

            // Advanced Zoom In / Zoom Out Modal with Sliding Multi-Photos & Description
            zoomedProduct ? (function() {
              const photoList = (zoomedProduct.photos && zoomedProduct.photos.length > 0) ? zoomedProduct.photos : [zoomedProduct.photo_url];
              const curPhoto = photoList[zoomPhotoIdx] || zoomedProduct.photo_url;

              const zoomIn = function() {
                if (zoomScale < 3) setZoomScale(Math.min(3, zoomScale + 0.5));
              };
              const zoomOut = function() {
                if (zoomScale > 1) setZoomScale(Math.max(1, zoomScale - 0.5));
              };

              const nextPhoto = function() {
                setZoomPhotoIdx((zoomPhotoIdx + 1) % photoList.length);
                setZoomScale(1);
              };
              const prevPhoto = function() {
                setZoomPhotoIdx((zoomPhotoIdx - 1 + photoList.length) % photoList.length);
                setZoomScale(1);
              };

              return h('div', { className: 'fixed inset-0 z-50 bg-stone-950/90 backdrop-blur-xs flex items-center justify-center p-3 animate-fade-in' },
                h('div', { className: 'bg-white rounded-2xl max-w-sm w-full p-4 space-y-3 max-h-[92vh] overflow-y-auto flex flex-col justify-between' },
                  // Modal Top Bar
                  h('div', { className: 'flex items-center justify-between pb-1 border-b border-stone-100' },
                    h('h3', { className: 'font-extrabold text-xs text-stone-900 line-clamp-1' }, zoomedProduct.name),
                    h('button', {
                      onClick: function() { setZoomedProduct(null); setZoomScale(1); },
                      className: 'w-6 h-6 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold flex items-center justify-center text-xs'
                    }, '✕')
                  ),

                  // Interactive Image Container with Zoom Controls
                  h('div', { className: 'relative aspect-square bg-stone-100 rounded-xl overflow-hidden flex items-center justify-center' },
                    h('img', {
                      src: curPhoto,
                      alt: zoomedProduct.name,
                      style: { transform: 'scale(' + zoomScale + ')', transition: 'transform 0.2s ease-in-out' },
                      className: 'max-h-full max-w-full object-contain'
                    }),

                    // Left & Right Carousel Arrows
                    photoList.length > 1 ? [
                      h('button', {
                        key: 'prev-btn',
                        onClick: prevPhoto,
                        className: 'absolute left-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-stone-900/70 text-white font-black text-sm flex items-center justify-center'
                      }, '‹'),
                      h('button', {
                        key: 'next-btn',
                        onClick: nextPhoto,
                        className: 'absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-stone-900/70 text-white font-black text-sm flex items-center justify-center'
                      }, '›')
                    ] : null,

                    // Interactive Zoom In (+) and Zoom Out (-) Buttons Overlay
                    h('div', { className: 'absolute top-2 right-2 flex items-center space-x-1' },
                      h('button', {
                        onClick: zoomOut,
                        disabled: zoomScale <= 1,
                        className: 'w-7 h-7 rounded-lg bg-stone-900/80 text-white font-black text-sm flex items-center justify-center shadow-xs disabled:opacity-40'
                      }, '−'),
                      h('span', { className: 'px-1.5 py-0.5 rounded-lg bg-stone-900/80 text-white font-bold text-[10px]' },
                        zoomScale + 'x'
                      ),
                      h('button', {
                        onClick: zoomIn,
                        disabled: zoomScale >= 3,
                        className: 'w-7 h-7 rounded-lg bg-stone-900/80 text-white font-black text-sm flex items-center justify-center shadow-xs disabled:opacity-40'
                      }, '+')
                    )
                  ),

                  // Photo Thumbnail Carousel Strip
                  photoList.length > 1 ? h('div', { className: 'flex items-center space-x-1.5 overflow-x-auto no-scrollbar py-0.5' },
                    photoList.map(function(thumb, tIdx) {
                      const isActive = tIdx === zoomPhotoIdx;
                      return h('div', {
                        key: tIdx,
                        onClick: function() { setZoomPhotoIdx(tIdx); setZoomScale(1); },
                        className: 'w-11 h-11 rounded-lg overflow-hidden border-2 cursor-pointer shrink-0 ' + (isActive ? 'border-amber-500 shadow-xs' : 'border-stone-200 opacity-60')
                      },
                        h('img', { src: thumb, alt: '', className: 'w-full h-full object-cover' })
                      );
                    })
                  ) : null,

                  // Product Details & Description
                  h('div', { className: 'space-y-1 text-left' },
                    h('div', { className: 'flex items-baseline justify-between' },
                      h('span', { className: 'font-black text-sm text-amber-700' }, Number(zoomedProduct.price_etb).toLocaleString() + ' ETB'),
                      zoomedProduct.size ? h('span', { className: 'text-[10px] text-stone-500' }, 'መጠን: ', h('b', null, zoomedProduct.size)) : null
                    ),
                    zoomedProduct.description ? h('p', { className: 'text-xs text-stone-600 leading-relaxed bg-stone-50 p-2 rounded-xl border border-stone-200' },
                      zoomedProduct.description
                    ) : null
                  ),

                  // Order CTAs inside modal
                  !isWorkerModeActive ? h('div', { className: 'grid grid-cols-2 gap-1.5 pt-2 border-t border-stone-100' },
                    h('button', {
                      onClick: function() { addToCart(zoomedProduct); setZoomedProduct(null); },
                      className: 'py-2 px-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-950 font-bold text-xs border border-amber-300'
                    }, '+ ወደ ካርት ጨምር'),
                    h('button', {
                      onClick: function() {
                        const target = zoomedProduct;
                        setZoomedProduct(null);
                        setDirectOrderProduct(target);
                        setDirectOrderQty(1);
                      },
                      className: 'py-2 px-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-stone-950 font-black text-xs shadow-xs'
                    }, 'በቀጥታ እዘዝ')
                  ) : null
                )
              );
            })() : null
          );
        }

        const rootEl = document.getElementById('root');
        if (rootEl) {
          ReactDOM.createRoot(rootEl).render(h(KorchaApp));
          if (window.Telegram && window.Telegram.WebApp) {
            try {
              window.Telegram.WebApp.ready();
              window.Telegram.WebApp.expand();
            } catch (err) {}
          }
        }
      })();
    </script>
  </body>
</html>
