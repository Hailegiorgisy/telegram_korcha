    <script>
      window.onerror = function(msg, url, line, col, err) {

        if (el) {
          el.innerHTML = '<div style="margin:20px;padding:15px;background:#fee2e2;border:1px solid #ef4444;border-radius:12px;color:#991b1b;font-family:sans-serif;font-size:13px;">' +

      const IconTrash = (props) => <SvgIcon d={["M3 6h18", "M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6", "M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"]} {...props} />;
      const IconEdit = (props) => <SvgIcon d={["M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7", "M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"]} {...props} />;
      const IconPlus = (props) => <SvgIcon d="M12 5v14 M5 12h14" {...props} />;
      const IconSparkles = (props) => <SvgIcon d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" {...props} />;

      // Fallback Shelf Data
      const INITIAL_PRODUCTS = [
        {
          id: 1,
          name: "Original Stanley Quencher H2.0 FlowState 40oz Tumbler",
          size: "40oz (1.18L)",
          price_etb: 4850,
          photo_url: "https://images.unsplash.com/photo-1577705998148-6da4f3963bc8?w=500&auto=format&fit=crop&q=80",
          photos: [
            "https://images.unsplash.com/photo-1577705998148-6da4f3963bc8?w=500&auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1544816155-12df9643f363?w=500&auto=format&fit=crop&q=80"
          ],
          description: "ቀኑን ሙሉ ቀዝቃዛ ወይም ትኩስ የሚያቆይ፣ ለስፖርትና ለቢሮ ተወዳጅ እቃ። 100% ኦሪጅናል ከ USA።",
          is_bestseller: true
        },
        {
          id: 2,
          name: "Apple AirPods Pro (2nd Generation) with MagSafe Case",
          size: "USB-C",
          price_etb: 14900,
          photo_url: "https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=500&auto=format&fit=crop&q=80",
          photos: [
            "https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=500&auto=format&fit=crop&q=80"
          ],
          description: "ምርጥ ድምፅ እና የጩኸት መከላከያ (Active Noise Cancellation) ያለው።",
          is_bestseller: true
        },
        {
          id: 3,
          name: "Hydrating Face Serum & Vitamin C Glow Complex",
          size: "50ml",
          price_etb: 1950,
          photo_url: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=500&auto=format&fit=crop&q=80",
          photos: [
            "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=500&auto=format&fit=crop&q=80"
          ],
          description: "የፊት ቆዳን የሚያለሰልስ እና ብሩህ የሚያደርግ የኮሪያ K-Beauty ሰረም።",
          is_bestseller: true
        }
      ];

      function App() {
        const [activeTab, setActiveTab] = useState('home');
        const [products, setProducts] = useState(INITIAL_PRODUCTS);
        const [cart, setCart] = useState(() => {
          try {
            const raw = localStorage.getItem('korcha_cart');
            return raw ? JSON.parse(raw) : [];
          } catch { return []; }
        });
        const [isCartOpen, setIsCartOpen] = useState(false);
        const [isQuoteOpen, setIsQuoteOpen] = useState(false);
        const [quoteMode, setQuoteMode] = useState('link');
        const [selectedRegion, setSelectedRegion] = useState('USA');
        const [zoomedProduct, setZoomedProduct] = useState(null);
        const [activePhotoIdx, setActivePhotoIdx] = useState(0);

        // Tracker state
        const [searchCode, setSearchCode] = useState('');
        const [trackedResult, setTrackedResult] = useState(null);
        const [isTracking, setIsTracking] = useState(false);

        // Worker detection
        const urlParams = new URLSearchParams(window.location.search);
        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        const isWorker = Boolean(
          urlParams.get('worker') === '1' ||
          urlParams.get('role') === 'worker' ||
          (tgUser?.username && ['korcha_support', 'hailegiorgisy'].includes(tgUser.username.replace('@', '').toLowerCase()))
        );

        useEffect(() => {
          if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
          }
          fetch('/api/shelf')
            .then(res => res.json())
            .then(data => {
              if (data.products && data.products.length > 0) setProducts(data.products);
            })
            .catch(() => {});
        }, []);

        useEffect(() => {
          try { localStorage.setItem('korcha_cart', JSON.stringify(cart)); } catch (_) {}
        }, [cart]);

        const addToCart = (product) => {
          setCart(prev => {
            const exist = prev.find(i => i.product.id === product.id);
            if (exist) {
              return prev.map(i => i.product.id === product.id ? { ...i, quantity: i.quantity + 1 } : i);
            }
            return [...prev, { product, quantity: 1 }];
          });
          if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
          }
        };

        const updateCartQty = (id, delta) => {
          setCart(prev => prev.map(i => {
            if (i.product.id === id) {
              const q = i.quantity + delta;
              return q > 0 ? { ...i, quantity: q } : null;
            }
            return i;
          }).filter(Boolean));
        };

        const totalCartPrice = cart.reduce((s, i) => s + (i.product.price_etb * i.quantity), 0);
        const totalCartCount = cart.reduce((s, i) => s + i.quantity, 0);

        const handleTrack = async (e) => {
          e.preventDefault();
          if (!searchCode.trim()) return;
          setIsTracking(true);
          try {
            const res = await fetch(`/api/messages/customer?codes=${searchCode.trim()}`);
            const data = await res.json();
            if (data.conversations && data.conversations.length > 0) {
              setTrackedResult(data.conversations[0]);
            } else {
              setTrackedResult({ notFound: true, code: searchCode.trim() });
            }
          } catch {
            setTrackedResult({ notFound: true, code: searchCode.trim() });
          } finally {
            setIsTracking(false);
          }
        };

        return (
          <div className="max-w-md mx-auto min-h-screen pb-20 bg-stone-100 flex flex-col">
            {/* Header */}
            <header className="sticky top-0 z-30 bg-white border-b border-stone-200 px-4 py-2.5 shadow-xs">

                    <p className="text-[10px] text-stone-500 font-medium">የውጭ ገበያ እቃ አቅራቢ</p>
                  </div>
                </div>

                <div className="flex items-center space-x-1.5">
                  {totalCartCount > 0 && (
                    <button
                      onClick={() => setIsCartOpen(true)}
                      className="px-2.5 py-1.5 rounded-full bg-amber-500 text-stone-950 font-bold text-xs flex items-center space-x-1 shadow-xs cursor-pointer active:scale-95"
                    >
                      <IconShoppingCart className="w-3.5 h-3.5" />
                      <span>{totalCartCount}</span>
                    </button>
                  )}
                  {isWorker && (
                    <span className="px-2 py-0.5 rounded-md bg-stone-900 text-amber-300 font-bold text-[10px]">
                      Worker Mode
                    </span>
                  )}
                </div>
              </div>

              {/* Navigation Tabs (3 Clean Action Tabs) */}
              <div className="flex items-center justify-between border-t border-stone-100 mt-2 pt-1.5 gap-1.5">
                <button
                  onClick={() => { setActiveTab('home'); setIsQuoteOpen(true); setQuoteMode('link'); }}
                  className="flex-1 py-1.5 rounded-lg font-bold text-xs flex items-center justify-center space-x-1 bg-amber-100 text-amber-950 border border-amber-300 active:scale-95 cursor-pointer shadow-xs"
                >
                  <IconShoppingBag className="w-3.5 h-3.5 text-amber-700" />
                  <span>እዘዝ (Order)</span>
                </button>

                <button
                  onClick={() => setActiveTab('tracker')}
                  className={`flex-1 py-1.5 rounded-lg font-bold text-xs flex items-center justify-center space-x-1 active:scale-95 cursor-pointer ${
                    activeTab === 'tracker' ? 'bg-amber-600 text-white' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'
                  }`}
                >
                  <IconPackage className="w-3.5 h-3.5" />
                  <span>ትዕዛዞች</span>
                </button>

                <button
                  onClick={() => setActiveTab('support')}
                  className={`flex-1 py-1.5 rounded-lg font-bold text-xs flex items-center justify-center space-x-1 active:scale-95 cursor-pointer ${
                    activeTab === 'support' ? 'bg-amber-600 text-white' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'

                >
                  <IconMessageCircle className="w-3.5 h-3.5" />

                </button>
              </div>

                      </div>

                      {/* Prominent Order CTAs */}

                        >
                          <IconLink className="w-3.5 h-3.5" />
                          <span>🔗 በሊንክ እዘዝ</span>
                        </button>

                        <button
                          onClick={() => { setQuoteMode('screenshot'); setIsQuoteOpen(true); }}
                          className="py-2 px-2.5 rounded-xl bg-white/15 text-white font-bold text-xs flex items-center justify-center space-x-1 border border-white/20 active:scale-95 cursor-pointer"
                        >
                          <IconCamera className="w-3.5 h-3.5 text-amber-400" />
                          <span>📸 በፎቶ እዘዝ</span>
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Compact Marketplaces & Pinduoduo Banner */}
                  <div className="bg-white rounded-xl p-2 border border-stone-200 space-y-1.5 shadow-2xs">
                    <div className="flex items-center justify-between text-[10px] font-bold text-stone-500 px-0.5">
                      <span>ዓለም አቀፍ ገበያዎች</span>
                      <span className="text-amber-700">ሊንክ ኮፒ አድርገው ይዘዙ</span>

                      <a href="https://www.aliexpress.com" target="_blank" className="p-1.5 rounded-lg bg-stone-50 border border-stone-200 text-center hover:bg-amber-50">
                        <span className="block text-xs font-black text-amber-700">AliExpress</span>
                        <span className="block text-[8.5px] text-stone-500">ኤሌክትሮኒክስ</span>

                      <a href="https://www.shein.com" target="_blank" className="p-1.5 rounded-lg bg-stone-50 border border-stone-200 text-center hover:bg-pink-50">

                        <span className="block text-[8.5px] text-stone-500">ፋሽን</span>
                      </a>

                        <span className="block text-[8.5px] text-stone-500">ሁሉም ዓይነት</span>

                    {/* Pinduoduo Banner */}

                      href="https://mobile.yangkeduo.com"
                      target="_blank"

                    </a>
                  </div>

                  {/* 3 Regional Hubs: USA Mart, Arabian Mart, Korean Mart */}
                  <div className="bg-white rounded-xl p-2.5 border border-stone-200 space-y-2 shadow-2xs">
                    <div className="grid grid-cols-3 gap-1">
                      {[
                        { id: 'USA', name: 'USA Mart', flag: '🇺🇸', sub: 'አሜሪካ' },
                        { id: 'ARABIAN', name: 'Arabian Mart', flag: '🇸🇦 🇦🇪', sub: 'የአረብ ገበያ' },
                        { id: 'KOREAN', name: 'Korean Mart', flag: '🇰🇷', sub: 'ኮሪያ' },
                      ].map(r => (
                        <button
                          key={r.id}
                          onClick={() => setSelectedRegion(r.id)}
                          className={`py-1.5 px-1 rounded-xl text-center border transition-all cursor-pointer ${
                            selectedRegion === r.id
                              ? 'border-amber-500 bg-amber-500 text-stone-950 font-black shadow-xs'

                        >
                          <span className="text-xs block leading-none">{r.flag}</span>

                              {cat}
                            </button>

                      )}

                      {selectedRegion === 'ARABIAN' && (
