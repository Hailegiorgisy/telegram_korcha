<!doctype html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Korcha (ኮርቻ) - የውጭ ገበያ እቃ አቅራቢ</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 & ReactDOM (Pure Native Production Build - Zero Babel, Zero Eval) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <style>
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #f5f5f4;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        background-color: #f5f5f4;
        color: #1c1917;
        overflow-x: hidden;
        overflow-y: auto;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-overflow-scrolling: touch;
        user-select: none;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        display: block;
        background-color: #f5f5f4;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f4;">
        <div style="text-align:center;">
          <div style="width:40px;height:40px;border:4px solid #f59e0b;border-top-color:transparent;border-radius:50%;margin:0 auto;animation:spin 1s linear infinite;"></div>
          <p style="font-size:12px;font-weight:bold;color:#44403c;margin-top:10px;">ኮርቻ ሱቅ እየተከፈተ ነው...</p>
        </div>
      </div>
    </div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

    <script>
      (function() {
        const { useState, useEffect, createElement: h } = React;

        // Structured Shelves: China (Top) and 3 Regional Marts (USA, Arabian, Korean)
        const INITIAL_PRODUCTS = [
          {
            id: 5,
            country: 'CHINA',
            category: 'Electronics',
            name: "Wireless ANC Bluetooth Earbuds with Smart LED Display",
            size: "One Size",
            price_etb: 1950,
            photo_url: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500&auto=format&fit=crop&q=80",
            description: "ከቻይና ቀጥታ ፋብሪካ የሚመጣ ድምፅ መከላከያ ያለው ኤርፎን።",
            is_bestseller: true
          },
          {
            id: 6,
            country: 'CHINA',
            category: 'Kitchen & Home',
            name: "Multifunctional Electric Hot Pot & Cooker",
            size: "1.8L",
            price_etb: 2600,
            photo_url: "https://images.unsplash.com/photo-1584269600464-37b1b58a9fe7?w=500&auto=format&fit=crop&q=80",
            description: "ለፈጣን ምግብ ማብሰያ ተመራጭ የቻይና እቃ።",
            is_bestseller: false
          },
          {
            id: 1,
            country: 'USA',
            category: 'Food',
            name: "Original Stanley Quencher H2.0 FlowState 40oz Tumbler",
            size: "40oz (1.18L)",
            price_etb: 4850,
            photo_url: "https://images.unsplash.com/photo-1577705998148-6da4f3963bc8?w=500&auto=format&fit=crop&q=80",
            description: "ቀኑን ሙሉ ቀዝቃዛ ወይም ትኩስ የሚያቆይ፣ ለስፖርትና ለቢሮ ተወዳጅ እቃ። 100% ኦሪጅናል ከ USA።",
            is_bestseller: true
          },
          {
            id: 2,
            country: 'USA',
            category: 'Supplements',
            name: "Optimum Nutrition Gold Standard 100% Whey Protein (5 lbs)",
            size: "5 lbs (2.27kg)",
            price_etb: 8900,
            photo_url: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=500&auto=format&fit=crop&q=80",
            description: "የአሜሪካ ቁጥር 1 የጡንቻ ማጎልበቻ ፕሮቲን።",
            is_bestseller: true
          },
          {
            id: 3,
            country: 'KOREAN',
            category: 'Skin care products',
            name: "COSRX Advanced Snail 96 Mucin Power Essence",
            size: "100ml",
            price_etb: 2450,
            photo_url: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=500&auto=format&fit=crop&q=80",
            description: "የፊት ቆዳን የሚያለሰልስ እና የሚያፈካ ታዋቂው የኮሪያ K-Beauty ሰረም።",
            is_bestseller: true
          },
          {
            id: 4,
            country: 'ARABIAN',
            category: 'Perfume & Oud',
            name: "Lattafa Khamrah Luxury Arabian Eau de Parfum",
            size: "100ml",
            price_etb: 3800,
            photo_url: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=500&auto=format&fit=crop&q=80",
            description: "የዱባይ እና ሳውዲ ልዩ መአዛ ያለው የቅንጦት ሽቶ።",
            is_bestseller: true
          }
        ];

        const CHINA_CATEGORIES = ['All', 'Electronics', 'Kitchen & Home', 'Clothing', 'Others'];

        const THREE_REGIONS = [
          { id: 'USA', name: 'USA Mart', flag: '🇺🇸', categories: ['All', 'Food', 'Supplements', 'Skin care products', 'Others'] },
          { id: 'ARABIAN', name: 'Arabian Mart', flag: '🇸🇦 🇦🇪', categories: ['All', 'Perfume & Oud', 'Abaya & Fashion', 'Supplements', 'Others'] },
          { id: 'KOREAN', name: 'Korean Mart', flag: '🇰🇷', categories: ['All', 'Skin care products'] }
        ];

        function KorchaApp() {
          const [activeTab, setActiveTab] = useState('home');
          const [products, setProducts] = useState(INITIAL_PRODUCTS);

          // China shelf category filter
          const [chinaCategory, setChinaCategory] = useState('All');

          // Three regions shelf state
          const [selectedRegion, setSelectedRegion] = useState('USA');
          const [regionCategory, setRegionCategory] = useState('All');

          // Worker role detection
          const urlParams = new URLSearchParams(window.location.search);
          const tgUser = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user : null;
          const tgUsername = tgUser && tgUser.username ? tgUser.username.replace('@', '').toLowerCase() : '';
          const isAuthorizedWorker = urlParams.get('worker') === '1' || urlParams.get('role') === 'worker' || ['korcha_support', 'hailegiorgisy'].includes(tgUsername);
          const [workerPreviewCustomer, setWorkerPreviewCustomer] = useState(false);
          const isWorkerModeActive = isAuthorizedWorker && !workerPreviewCustomer;

          // Cart state (Changed to ካርት)
          const [cart, setCart] = useState(function() {
            try {
              const raw = localStorage.getItem('korcha_cart');
              return raw ? JSON.parse(raw) : [];
            } catch (e) { return []; }
          });
          const [isCartOpen, setIsCartOpen] = useState(false);

          // Quote modal
          const [isQuoteOpen, setIsQuoteOpen] = useState(false);
          const [quoteMode, setQuoteMode] = useState('link');
          const [quoteUrl, setQuoteUrl] = useState('');
          const [quoteSpecs, setQuoteSpecs] = useState('');
          const [quotePhone, setQuotePhone] = useState('');
          const [quoteSite, setQuoteSite] = useState('');

          // Worker Add/Edit Product state
          const [isAddProductOpen, setIsAddProductOpen] = useState(false);
          const [editingProduct, setEditingProduct] = useState(null);
          const [newProdName, setNewProdName] = useState('');
          const [newProdCountry, setNewProdCountry] = useState('CHINA');
          const [newProdCategory, setNewProdCategory] = useState('Electronics');
          const [newProdPrice, setNewProdPrice] = useState('');
          const [newProdSize, setNewProdSize] = useState('Standard');
          const [newProdPhoto, setNewProdPhoto] = useState('');
          const [newProdDesc, setNewProdDesc] = useState('');

          // Chat / Support state
          const [chatMessages, setChatMessages] = useState([
            { id: 1, sender: 'worker', text: 'ሰላም! እንኳን ወደ ኮርቻ የደንበኞች አገልግሎት በደህና መጡ። ምን ልርዳዎት?' }
          ]);
          const [newMsgText, setNewMsgText] = useState('');
          const [chatPhone, setChatPhone] = useState('');

          // Tracker state
          const [searchCode, setSearchCode] = useState('');
          const [trackedResult, setTrackedResult] = useState(null);
          const [isTracking, setIsTracking] = useState(false);

          // Zoom state
          const [zoomedProduct, setZoomedProduct] = useState(null);

          // Fetch products from backend
          useEffect(function() {
            fetch('/api/shelf')
              .then(function(res) { return res.json(); })
              .then(function(data) {
                if (data.products && data.products.length > 0) {
                  setProducts(data.products);
                }
              })
              .catch(function() {});
          }, []);

          // Sync cart to localStorage
          useEffect(function() {
            try { localStorage.setItem('korcha_cart', JSON.stringify(cart)); } catch (e) {}
          }, [cart]);

          const addToCart = function(product) {
            setCart(function(prev) {
              const exist = prev.find(function(i) { return i.product.id === product.id; });
              if (exist) {
                return prev.map(function(i) {
                  return i.product.id === product.id ? Object.assign({}, i, { quantity: i.quantity + 1 }) : i;
                });
              }
              return prev.concat([{ product: product, quantity: 1 }]);
            });
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
              window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }
          };

          const updateCartQty = function(id, delta) {
            setCart(function(prev) {
              return prev.map(function(i) {
                if (i.product.id === id) {
                  const q = i.quantity + delta;
                  return q > 0 ? Object.assign({}, i, { quantity: q }) : null;
                }
                return i;
              }).filter(Boolean);
            });
          };

          const totalCartPrice = cart.reduce(function(s, i) { return s + (i.product.price_etb * i.quantity); }, 0);
          const totalCartCount = cart.reduce(function(s, i) { return s + i.quantity; }, 0);

          // Products filtered for China Shelf (Top)
          const chinaProducts = products.filter(function(p) {
            const isChina = (p.country || '').toUpperCase() === 'CHINA';
            const matchesCat = chinaCategory === 'All' || !p.category || p.category.toLowerCase() === chinaCategory.toLowerCase();
            return isChina && matchesCat;
          });

          // Products filtered for Three Regions Shelf (Below China)
          const activeRegionObj = THREE_REGIONS.find(function(r) { return r.id === selectedRegion; }) || THREE_REGIONS[0];
          const regionProducts = products.filter(function(p) {
            const isReg = (p.country || '').toUpperCase() === selectedRegion.toUpperCase();
            const matchesCat = regionCategory === 'All' || !p.category || p.category.toLowerCase() === regionCategory.toLowerCase();
            return isReg && matchesCat;
          });

          // Worker CRUD handlers
          const handleSaveNewProduct = function(e) {
            e.preventDefault();
            if (!newProdName.trim() || !newProdPrice) {
              alert('እባክዎ የእቃውን ስም እና ዋጋ ያስገቡ');
              return;
            }
            const p = {
              id: Date.now(),
              name: newProdName.trim(),
              country: newProdCountry,
              category: newProdCategory,
              price_etb: parseFloat(newProdPrice),
              size: newProdSize.trim() || 'Standard',
              photo_url: newProdPhoto.trim() || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=80',
              description: newProdDesc.trim() || 'ኦሪጅናል እቃ።',
              is_bestseller: false
            };
            setProducts(function(prev) { return [p].concat(prev); });
            fetch('/api/shelf/products', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(p)
            }).catch(function() {});
            alert('✅ አዲስ እቃ መደርደሪያው ላይ ተጨምሯል!');
            setIsAddProductOpen(false);
            setNewProdName('');
            setNewProdPrice('');
            setNewProdPhoto('');
            setNewProdDesc('');
          };

          const handleDeleteProduct = function(id) {
            if (!confirm('ይህንን እቃ ከመደርደሪያው ላይ ማጥፋት ይፈልጋሉ?')) return;
            setProducts(function(prev) { return prev.filter(function(p) { return p.id !== id; }); });
            fetch('/api/shelf/products/' + id, { method: 'DELETE' }).catch(function() {});
          };

          const handleUpdateProduct = function(e) {
            e.preventDefault();
            if (!editingProduct) return;
            setProducts(function(prev) {
              return prev.map(function(p) {
                return p.id === editingProduct.id ? editingProduct : p;
              });
            });
            fetch('/api/shelf/products/' + editingProduct.id, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(editingProduct)
            }).catch(function() {});
            alert('✅ የእቃው መረጃ ተስተካክሏል!');
            setEditingProduct(null);
          };

          // Chat send handler
          const handleSendChatMessage = function(e) {
            e.preventDefault();
            if (!newMsgText.trim()) return;
            const msg = {
              id: Date.now(),
              sender: 'customer',
              text: newMsgText.trim(),
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            setChatMessages(function(prev) { return prev.concat([msg]); });
            setNewMsgText('');
            fetch('/api/quotes', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                phone: chatPhone || '0911000000',
                details: '[Live Chat] ' + msg.text
              })
            }).catch(function() {});
          };

          // Render Product Card Component Helper
          const renderProductCard = function(p) {
            return h('div', { key: p.id, className: 'bg-white rounded-xl border border-stone-200 overflow-hidden shadow-2xs flex flex-col justify-between' },
              // Image
              h('div', {
                onClick: function() { setZoomedProduct(p); },
                className: 'relative aspect-square bg-stone-100 cursor-pointer overflow-hidden'
              },
                h('img', { src: p.photo_url, alt: p.name, className: 'w-full h-full object-cover' }),
                p.is_bestseller ? h('span', { className: 'absolute top-1 left-1 bg-amber-500 text-stone-950 font-black text-[8px] px-1.5 py-0.2 rounded' }, 'ተወዳጅ') : null,
                h('span', { className: 'absolute bottom-1 right-1 bg-stone-900/70 text-white text-[8px] px-1.5 py-0.2 rounded font-bold' }, '🔍 አጉላ')
              ),

              // Details
              h('div', { className: 'p-2 space-y-1 flex flex-col justify-between flex-1' },
                h('div', null,
                  h('h4', { className: 'font-extrabold text-[11px] text-stone-900 line-clamp-2 leading-tight' }, p.name),
                  p.size ? h('p', { className: 'text-[9px] text-stone-500' }, 'መጠን: ' + p.size) : null
                ),

                h('div', { className: 'pt-1 border-t border-stone-100 space-y-1' },
                  h('div', { className: 'flex items-baseline justify-between' },
                    h('span', { className: 'text-xs font-black text-amber-700' }, Number(p.price_etb).toLocaleString() + ' ETB'),
                    !isWorkerModeActive ? h('span', { className: 'text-[8px] text-stone-400' }, '40%: ' + Math.round(p.price_etb * 0.4).toLocaleString()) : null
                  ),

                  // ROLE-BASED CONTROLS: (Changed to ካርት)
                  isWorkerModeActive ? (
                    h('div', { className: 'grid grid-cols-2 gap-1 pt-0.5' },
                      h('button', {
                        onClick: function() { setEditingProduct(Object.assign({}, p)); },
                        className: 'py-1 px-1 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-900 font-bold text-[10px] border border-amber-300'
                      }, '✏️ አርም'),
                      h('button', {
                        onClick: function() { handleDeleteProduct(p.id); },
                        className: 'py-1 px-1 rounded-lg bg-red-50 hover:bg-red-100 text-red-700 font-bold text-[10px] border border-red-200'
                      }, '🗑️ አጥፋ')
                    )
                  ) : (
                    h('div', { className: 'grid grid-cols-2 gap-1 pt-0.5' },
                      h('button', {
                        onClick: function() { addToCart(p); },
                        className: 'py-1 px-1 rounded-lg bg-amber-100 hover:bg-amber-200 text-amber-950 font-bold text-[10px] border border-amber-300'
                      }, '+ ካርት'),
                      h('button', {
                        onClick: function() { setQuoteMode('screenshot'); setQuoteSpecs(p.name); setQuoteSite(p.country || 'International'); setIsQuoteOpen(true); },
                        className: 'py-1 px-1 rounded-lg bg-amber-500 hover:bg-amber-400 text-stone-950 font-black text-[10px] shadow-xs'
                      }, 'እዘዝ')
                    )
                  )
                )
              )
            );
          };

          return h('div', { className: 'max-w-md mx-auto min-h-screen pb-20 bg-stone-100 flex flex-col' },
            // App Header
            h('header', { className: 'sticky top-0 z-30 bg-white border-b border-stone-200 px-4 py-2.5 shadow-xs' },
              h('div', { className: 'flex items-center justify-between' },
                h('div', { className: 'flex items-center space-x-2' },
                  h('div', { className: 'w-8 h-8 rounded-xl bg-amber-400 p-0.5 border border-amber-500/40 flex items-center justify-center overflow-hidden' },
                    h('img', { src: '/logo.png', alt: 'Korcha', className: 'w-full h-full object-contain', onError: function(e) { e.target.style.display = 'none'; } })
                  ),
                  h('div', null,
                    h('h1', { className: 'text-sm font-extrabold text-stone-900 leading-none' }, 'KORCHA'),
                    h('p', { className: 'text-[10px] text-stone-500 font-medium' }, isWorkerModeActive ? 'የሰራተኛ መቆጣጠሪያ ማዕከል' : 'የውጭ ገበያ እቃ አቅራቢ')
                  )
                ),

                h('div', { className: 'flex items-center space-x-1.5' },
                  isAuthorizedWorker ? h('button', {
                    onClick: function() { setWorkerPreviewCustomer(!workerPreviewCustomer); },
                    className: 'px-2 py-1 rounded-lg text-[10px] font-bold border transition-all ' + (isWorkerModeActive ? 'bg-stone-900 text-amber-300 border-amber-500' : 'bg-amber-100 text-amber-900 border-amber-300')
                  }, isWorkerModeActive ? '🛠️ ሰራተኛ ሞድ' : '👁️ ደንበኛ እይታ') : null,

                  !isWorkerModeActive && totalCartCount > 0 ? h('button', {
                    onClick: function() { setIsCartOpen(true); },
                    className: 'px-2.5 py-1.5 rounded-full bg-amber-500 text-stone-950 font-bold text-xs flex items-center space-x-1 shadow-xs cursor-pointer active:scale-95'
                  }, '🛒 ' + totalCartCount) : null
                )
              ),

              // Navigation Tabs
              h('div', { className: 'flex items-center justify-between border-t border-stone-100 mt-2 pt-1.5 gap-1.5' },
                h('button', {
                  onClick: function() { setActiveTab('home'); },
                  className: 'flex-1 py-1.5 rounded-lg font-bold text-xs flex items-center justify-center space-x-1 cursor-pointer ' + (activeTab === 'home' ? 'bg-amber-500 text-stone-950 font-black shadow-xs' : 'bg-stone-100 text-stone-700 hover:bg-stone-200')
                }, isWorkerModeActive ? '📦 መደርደሪያ አስተዳድር' : '🛍️ መደርደሪያ (Shop)'),

                h('button', {
                  onClick: function() { setActiveTab('tracker'); },
                  className: 'flex-1 py-1.5 rounded-lg font-bold text-xs flex items-center justify-center space-x-1 cursor-pointer ' + (activeTab === 'tracker' ? 'bg-amber-600 text-white shadow-xs' : 'bg-stone-100 text-stone-700 hover:bg-stone-200')
                }, '📦 ትዕዛዞች'),

                h('button', {
                  onClick: function() { setActiveTab('support'); },
                  className: 'flex-1 py-1.5 rounded-lg font-bold text-xs flex items-center justify-center space-x-1 cursor-pointer ' + (activeTab === 'support' ? 'bg-amber-600 text-white shadow-xs' : 'bg-stone-100 text-stone-700 hover:bg-stone-200')
                }, '💬 መልዕክት (Chat)')
              )
            ),

            // Main Content Area
            h('main', { className: 'p-3 space-y-3.5 flex-1' },
              activeTab === 'home' ? [
                // Worker Admin Banner
                isWorkerModeActive ? h('div', { key: 'worker-bar', className: 'p-3 rounded-2xl bg-gradient-to-r from-stone-900 to-amber-950 text-white border border-amber-500/40 space-y-2' },
                  h('div', { className: 'flex items-center justify-between' },

                      placeholder: 'ምድብ (Category)...',
                      value: newProdCategory,
                      onChange: function(e) { setNewProdCategory(e.target.value); },
                      className: 'p-2 rounded-lg border border-stone-300'
                    })
                  ),
                  h('input', {
                    type: 'text',
                    required: true,
                    placeholder: 'የእቃው ስም (Product Name)...',
                    value: newProdName,
                    onChange: function(e) { setNewProdName(e.target.value); },
                    className: 'w-full p-2 rounded-lg border border-stone-300'
                  }),
                  h('div', { className: 'grid grid-cols-2 gap-1.5' },
                    h('input', {
                      type: 'number',
                      required: true,
                      placeholder: 'ዋጋ በብር (ETB)...',
                      value: newProdPrice,
                      onChange: function(e) { setNewProdPrice(e.target.value); },
                      className: 'p-2 rounded-lg border border-stone-300 font-bold text-amber-700'
                    }),
                    h('input', {
                      type: 'text',
                      placeholder: 'መጠን (Size)...',
                      value: newProdSize,
                      onChange: function(e) { setNewProdSize(e.target.value); },
                      className: 'p-2 rounded-lg border border-stone-300'
                    })
                  ),
                  h('input', {
                    type: 'url',
                    placeholder: 'የፎቶ ሊንክ (Photo URL)...',
                    value: newProdPhoto,
                    onChange: function(e) { setNewProdPhoto(e.target.value); },
                    className: 'w-full p-2 rounded-lg border border-stone-300'
                  }),
                  h('textarea', {
                    placeholder: 'አጭር መግለጫ (Description)...',
                    value: newProdDesc,
                    onChange: function(e) { setNewProdDesc(e.target.value); },
                    className: 'w-full p-2 rounded-lg border border-stone-300 h-16'
                  }),
                  h('button', { type: 'submit', className: 'w-full py-2.5 rounded-xl bg-amber-500 text-stone-950 font-black' }, 'መደርደሪያ ላይ ጫን (Publish)')
                )
              )
            ) : null,

            // Worker: Edit Product Modal
            editingProduct ? h('div', { className: 'fixed inset-0 z-50 bg-stone-950/80 flex items-center justify-center p-3' },
              h('div', { className: 'bg-white rounded-2xl max-w-sm w-full p-4 space-y-3' },
                h('div', { className: 'flex items-center justify-between' },
                  h('h3', { className: 'font-extrabold text-xs' }, 'እቃውን አርም (Edit Product)'),
                  h('button', { onClick: function() { setEditingProduct(null); }, className: 'font-bold text-stone-500' }, '✕')
                ),
                h('form', { onSubmit: handleUpdateProduct, className: 'space-y-2 text-xs' },
                  h('input', {
                    type: 'text',
                    value: editingProduct.name,
                    onChange: function(e) { setEditingProduct(Object.assign({}, editingProduct, { name: e.target.value })); },
                    className: 'w-full p-2 rounded-lg border border-stone-300'
                  }),
                  h('div', { className: 'grid grid-cols-2 gap-1.5' },
                    h('input', {
                      type: 'number',
                      value: editingProduct.price_etb,
                      onChange: function(e) { setEditingProduct(Object.assign({}, editingProduct, { price_etb: parseFloat(e.target.value) })); },
                      className: 'p-2 rounded-lg border border-stone-300 font-bold text-amber-700'
                    }),
                    h('input', {
                      type: 'text',
                      value: editingProduct.size || '',
                      onChange: function(e) { setEditingProduct(Object.assign({}, editingProduct, { size: e.target.value })); },
                      className: 'p-2 rounded-lg border border-stone-300'
                    })
                  ),
                  h('button', { type: 'submit', className: 'w-full py-2.5 rounded-xl bg-amber-500 text-stone-950 font-black' }, 'ለውጦችን መዝግብ (Save)')
                )
              )
            ) : null,

            // Zoom Modal
            zoomedProduct ? h('div', { className: 'fixed inset-0 z-50 bg-stone-950/80 flex items-center justify-center p-3' },
              h('div', { className: 'bg-white rounded-2xl max-w-sm w-full p-4 space-y-3' },
                h('div', { className: 'flex items-center justify-between' },
                  h('h3', { className: 'font-extrabold text-xs line-clamp-1' }, zoomedProduct.name),
                  h('button', { onClick: function() { setZoomedProduct(null); }, className: 'font-bold text-stone-500' }, '✕')
                ),
                h('div', { className: 'aspect-square bg-stone-100 rounded-xl overflow-hidden' },
                  h('img', { src: zoomedProduct.photo_url, alt: '', className: 'w-full h-full object-contain' })
                ),
                zoomedProduct.description ? h('p', { className: 'text-xs text-stone-600' }, zoomedProduct.description) : null,
                h('div', { className: 'flex items-center justify-between pt-2 border-t' },
                  h('span', { className: 'font-black text-sm text-amber-700' }, Number(zoomedProduct.price_etb).toLocaleString() + ' ETB'),
                  !isWorkerModeActive ? h('button', {
                    onClick: function() { addToCart(zoomedProduct); setZoomedProduct(null); },
                    className: 'px-4 py-2 rounded-xl bg-amber-500 text-stone-950 font-bold text-xs'
                  }, '+ ወደ ካርት ጨምር') : null
                )
              )
            ) : null
          );
        }

        const rootEl = document.getElementById('root');
        if (rootEl) {
          ReactDOM.createRoot(rootEl).render(h(KorchaApp));
          if (window.Telegram && window.Telegram.WebApp) {
            try {
              window.Telegram.WebApp.ready();
              window.Telegram.WebApp.expand();
            } catch (err) {}
          }
        }
      })();
    </script>
  </body>
</html>
