
<svg width="640" height="640" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="65%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="640" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="100" y1="100" x2="540" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="640" height="640" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="640" fill="url(#bgGlow)" rx="160" />

  <!-- Outer Ring Badge -->
  <circle cx="320" cy="300" r="240" stroke="url(#ringGrad)" stroke-width="8" fill="url(#innerGlow)" filter="url(#shadow)" />
  <circle cx="320" cy="300" r="226" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.4" />

  <!-- Embedded Korcha Saddle Icon scaled up in center -->
  <g transform="translate(140, 120) scale(7.5)">
    <defs>
      <linearGradient id="kl" x1="6" y1="8" x2="42" y2="38" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="45%" stop-color="#b45309" />
        <stop offset="100%" stop-color="#78350f" />
      </linearGradient>
      <linearGradient id="ks" x1="12" y1="14" x2="36" y2="28" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#d97706" />
        <stop offset="100%" stop-color="#92400e" />
      </linearGradient>
      <linearGradient id="kb" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fef08a" />
        <stop offset="50%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>
      <linearGradient id="kbk" x1="10" y1="26" x2="38" y2="36" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#dc2626" />
        <stop offset="50%" stop-color="#b91c1c" />
        <stop offset="100%" stop-color="#7f1d1d" />
      </linearGradient>
      <linearGradient id="km" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#e2e8f0" />
        <stop offset="50%" stop-color="#94a3b8" />
        <stop offset="100%" stop-color="#475569" />
      </linearGradient>
    </defs>
    <!-- Blanket -->
    <path d="M9 25 C14 23 34 23 39 25 L37 32 C31 33 17 33 11 32 Z" fill="url(#kbk)" stroke="#991b1b" stroke-width="1" />
    <circle cx="13" cy="31" r="0.9" fill="url(#kb)" />
    <circle cx="18" cy="31.5" r="0.9" fill="url(#kb)" />
    <circle cx="24" cy="32" r="0.9" fill="url(#kb)" />
    <circle cx="30" cy="31.5" r="0.9" fill="url(#kb)" />
    <circle cx="35" cy="31" r="0.9" fill="url(#kb)" />
    <!-- Saddle Tree -->
    <path d="M10 20 C10 13 13 8 16 8 C18 8 19 12 21 15 C24 18 28 18 31 15 C33 13 35 10 38 10 C41 10 43 14 41 21 C39 26 36 28 29 28 C19 28 11 26 10 20 Z" fill="url(#kl)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Seat -->
    <path d="M16 14 C19 17 29 17 32 14 C30 20 18 20 16 14 Z" fill="url(#ks)" stroke="#92400e" stroke-width="1" />
    <!-- Pommel & Cantle -->
    <path d="M13 10 C14 7 16 6 17 7 C18 8 17 12 15 13 C13 13 12 11 13 10 Z" fill="url(#kb)" stroke="#b45309" stroke-width="0.8" />
    <path d="M37 10 C39 10 40 12 39 14 C37 15 35 14 36 12 C36 11 36.5 10.5 37 10 Z" fill="url(#kb)" stroke="#b45309" stroke-width="0.8" />
    <!-- Studs -->
    <circle cx="24" cy="23" r="3.2" fill="url(#kb)" stroke="#78350f" stroke-width="0.8" />
    <circle cx="24" cy="23" r="1.4" fill="#78350f" />
    <circle cx="24" cy="20.8" r="0.6" fill="#fef08a" />
    <circle cx="24" cy="25.2" r="0.6" fill="#fef08a" />
    <circle cx="21.8" cy="23" r="0.6" fill="#fef08a" />
    <circle cx="26.2" cy="23" r="0.6" fill="#fef08a" />
    <!-- Flap & Stirrup -->
    <path d="M16 26 C15 31 16 36 19 39 C21 39 23 37 23 30" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M26 26 L28 37" stroke="#451a03" stroke-width="1.8" stroke-linecap="round" />
    <rect x="26.2" y="32" width="2.2" height="1.6" rx="0.5" fill="url(#kb)" />
    <path d="M25 37 C25 41 31 41 31 37 L29 37 C29 39.5 27 39.5 27 37 Z" fill="url(#km)" stroke="#334155" stroke-width="0.8" stroke-linejoin="round" />
    <line x1="24.5" y1="41" x2="31.5" y2="41" stroke="#334155" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Typography Brand Banner at bottom of avatar -->
  <text x="320" y="555" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="4">KORCHA</text>
  <text x="320" y="595" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#f59e0b" letter-spacing="2">ኮርቻ</text>
</svg>
