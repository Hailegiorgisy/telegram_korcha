name: Korcha Mobile OTA Update

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile_app/**'

jobs:
  ota-update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Publish OTA update to preview & production
        run: |
          eas update --branch preview --message "Auto-update from GitHub (${{ github.sha }})" --non-interactive
          eas update --branch production --message "Auto-update from GitHub (${{ github.sha }})" --non-interactive
