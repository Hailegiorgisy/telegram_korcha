<?xml version="1.0" encoding="UTF-8"?>
<!-- 640×360 adapter SVG that embeds the original square avatar and centers it in a 16:9 canvas. -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Korcha avatar 640x360">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07152d"/>
      <stop offset="100%" stop-color="#0b1a2d"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg)" rx="28"/>

  <!-- Center the square avatar in a 16:9 layout -->
  <g transform="translate(0,0)">
    <image href="./korcha-avatar-botfather.svg" x="140" y="0" width="360" height="360" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
